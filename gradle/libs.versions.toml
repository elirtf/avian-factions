# Pins from docs/research/build-toolchain.md and docs/research/mc-version-and-plugin-stack.md.
[versions]
paper-api = "26.1.2.build.74-stable"
vault = "1.7.1"
placeholderapi = "2.12.3"
auraskills = "2.4.0"
economyshopgui-api = "1.10.1"
rosestacker = "1.5.42"
configurate = "4.2.0"
hikari = "7.1.0"
mariadb = "3.5.10"
flyway = "13.7.0"
junit = "6.1.3"
mockbukkit = "4.115.0"
testcontainers = "2.0.5"
shadow = "9.6.1"
run-paper = "3.1.0"
# The log4j-core Paper 26.1.2 ships (run/libraries); compile-only, for PlayTimeManagerLogFix.
log4j = "2.25.2"
# EvenMoreFish 2.5.0 calls FriendlyId when a fish sells but ships without it; avian-plugin carries it.
friendly-id = "1.1.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
vault = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault" }
# Same version as the pinned PlaceholderAPI plugin jar (HelpChat's repository).
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
# Same version as the pinned AuraSkills plugin jar (Maven Central).
auraskills-api = { module = "dev.aurelium:auraskills-api-bukkit", version.ref = "auraskills" }
# API-only artifact (45 KB), versioned on JitPack — unlike the plugin jar, which only exists behind
# a floating SpigotMC mirror. The plugin itself is still pinned by hash in downloadPlugins.
economyshopgui-api = { module = "com.github.Gypopo:EconomyShopGUI-API", version.ref = "economyshopgui-api" }
# RoseStacker's API, same version as the pinned plugin jar (Rosewood's repository).
rosestacker = { module = "dev.rosewood:rosestacker", version.ref = "rosestacker" }
configurate-core = { module = "org.spongepowered:configurate-core", version.ref = "configurate" }
configurate-hocon = { module = "org.spongepowered:configurate-hocon", version.ref = "configurate" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
friendly-id = { module = "com.devskiller.friendly-id:friendly-id", version.ref = "friendly-id" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.1.2", version.ref = "mockbukkit" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }

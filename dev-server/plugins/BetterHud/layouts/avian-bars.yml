# Left: heart orb, health (top) and armor (bottom). Right, mirrored: food orb, food (top) and mana
# (bottom; air replaces mana while underwater). Each group is 81 GUI px; the right one is an exact
# mirror image, anchored by its outer edge (offset right). Scale 0.75: 28 texels = 21 px exactly. Health fill: wither > poison > frozen >
# normal, absorption drawn gold over it. Layers: casing 0, fill 1, absorption 2, orb 3.
avian_health:
  offset: left
  images:
    1: {name: avian_casing_l, scale: 0.75, conditions: {1: {first: health, second: "6", operation: ">"}}}
    2: {name: avian_casing_alarm, scale: 0.75, conditions: {1: {first: health, second: "6", operation: "<="}}}
    3:
      name: avian_fill_health
      x: 21
      scale: 0.75
      layer: 1
      conditions:
        1: {first: "potion_effect_duration:wither", second: "0", operation: "=="}
        2: {first: "potion_effect_duration:poison", second: "0", operation: "=="}
        3: {first: frozen, second: "false", operation: "=="}
    4:
      name: avian_fill_poison
      x: 21
      scale: 0.75
      layer: 1
      conditions:
        1: {first: "potion_effect_duration:wither", second: "0", operation: "=="}
        2: {first: "potion_effect_duration:poison", second: "0", operation: ">"}
    5: {name: avian_fill_wither, x: 21, scale: 0.75, layer: 1, conditions: {1: {first: "potion_effect_duration:wither", second: "0", operation: ">"}}}
    6:
      name: avian_fill_frozen
      x: 21
      scale: 0.75
      layer: 1
      conditions:
        1: {first: "potion_effect_duration:wither", second: "0", operation: "=="}
        2: {first: "potion_effect_duration:poison", second: "0", operation: "=="}
        3: {first: frozen, second: "true", operation: "=="}
    7: {name: avian_fill_absorption, x: 21, scale: 0.75, layer: 2, conditions: {1: {first: absorption, second: "0", operation: ">"}}}
    8: {name: avian_fill_armor, x: 21, scale: 0.75, layer: 1}
    9: {name: avian_orb_heart, scale: 0.75, layer: 3, conditions: {1: {first: health, second: "6", operation: ">"}}}
    10: {name: avian_orb_heart_low, scale: 0.75, layer: 3, conditions: {1: {first: health, second: "6", operation: "<="}}}

avian_food:
  offset: right
  images:
    1: {name: avian_casing_r, scale: 0.75}
    2: {name: avian_fill_food, scale: 0.75, layer: 1, conditions: {1: {first: "potion_effect_duration:hunger", second: "0", operation: "=="}}}
    3: {name: avian_fill_food_sick, scale: 0.75, layer: 1, conditions: {1: {first: "potion_effect_duration:hunger", second: "0", operation: ">"}}}
    4: {name: avian_fill_mana, scale: 0.75, layer: 1, conditions: {1: {first: air, second: max_air, operation: ">="}}}
    5: {name: avian_fill_air, scale: 0.75, layer: 1, conditions: {1: {first: air, second: max_air, operation: "<"}}}
    6: {name: avian_orb_food, x: 60, scale: 0.75, layer: 3}

# Avian HUD art (assets/avian_*.png), a remix of pxlpunkt's "Pulsing Heart" (itch.io; commercial use
# and modification allowed): their orb, heartbeat and segmented bars, lengthened, recoloured per status
# and mirrored for the right side. Every image is 28 texels tall and shown at scale 0.75 (exactly 21 px),
# with near-invisible corner pixels so BetterHud cannot trim it to a different scale. Lower-row
# fills (armor, mana, air) are drawn in their own row, so no piece needs a fractional offset.
avian_casing_l: {type: single, file: avian_casing_l.png}
avian_casing_r: {type: single, file: avian_casing_r.png}
avian_orb_food: {type: single, file: avian_orb_food.png}

# "file:N" holds a frame for N ticks (100 ms a frame). Low health keeps the tempo and turns the glass red.
avian_orb_heart:
  type: sequence
  files: [avian_heart_00.png:2, avian_heart_01.png:2, avian_heart_02.png:2, avian_heart_03.png:2, avian_heart_04.png:2, avian_heart_05.png:2, avian_heart_06.png:2, avian_heart_07.png:2, avian_heart_08.png:2, avian_heart_09.png:2, avian_heart_10.png:2, avian_heart_11.png:2]
avian_orb_heart_low:
  type: sequence
  files: [avian_heart_alarm_00.png:2, avian_heart_alarm_01.png:2, avian_heart_alarm_02.png:2, avian_heart_alarm_03.png:2, avian_heart_alarm_04.png:2, avian_heart_alarm_05.png:2, avian_heart_alarm_06.png:2, avian_heart_alarm_07.png:2, avian_heart_alarm_08.png:2, avian_heart_alarm_09.png:2, avian_heart_alarm_10.png:2, avian_heart_alarm_11.png:2]
avian_casing_alarm:
  type: sequence
  files: [avian_casing_alarm_l.png:6, avian_casing_l.png:6]

# Fills split into 20 frames (1 HP each on health) and drain toward the hotbar centre.
avian_fill_health: {type: listener, file: avian_fill_health.png, split: 20, split-type: left, setting: {listener: {class: health}}}
avian_fill_poison: {type: listener, file: avian_fill_poison.png, split: 20, split-type: left, setting: {listener: {class: health}}}
avian_fill_wither: {type: listener, file: avian_fill_wither.png, split: 20, split-type: left, setting: {listener: {class: health}}}
avian_fill_frozen: {type: listener, file: avian_fill_frozen.png, split: 20, split-type: left, setting: {listener: {class: health}}}
avian_fill_absorption: {type: listener, file: avian_fill_absorption.png, split: 20, split-type: left, setting: {listener: {class: absorption}}}
avian_fill_armor: {type: listener, file: avian_fill_armor.png, split: 20, split-type: left, setting: {listener: {class: armor}}}
avian_fill_food: {type: listener, file: avian_fill_food.png, split: 20, split-type: right, setting: {listener: {class: food}}}
avian_fill_food_sick: {type: listener, file: avian_fill_food_sick.png, split: 20, split-type: right, setting: {listener: {class: food}}}
avian_fill_air: {type: listener, file: avian_fill_air.png, split: 20, split-type: right, setting: {listener: {class: air}}}
# AuraSkills mana, through PlaceholderAPI.
avian_fill_mana:
  type: listener
  file: avian_fill_mana.png
  split: 20
  split-type: right
  setting:
    listener:
      class: placeholder
      value: "(number)papi:auraskills_mana"
      max: "(number)papi:auraskills_mana_max"

# The level orb and its gold filigree, one per tier (emerald 0-29, sapphire 30-59, amethyst 60-99,
# ruby 100+); layouts/avian-level.yml picks by level. Drawn by tools/hud-art/LevelArt.java.
avian_orb_level_emerald: {type: single, file: avian_orb_level_emerald.png}
avian_orb_level_sapphire: {type: single, file: avian_orb_level_sapphire.png}
avian_orb_level_amethyst: {type: single, file: avian_orb_level_amethyst.png}
avian_orb_level_ruby: {type: single, file: avian_orb_level_ruby.png}
avian_ornament_emerald: {type: single, file: avian_ornament_emerald.png}
avian_ornament_sapphire: {type: single, file: avian_ornament_sapphire.png}
avian_ornament_amethyst: {type: single, file: avian_ornament_amethyst.png}
avian_ornament_ruby: {type: single, file: avian_ornament_ruby.png}

# Level-up burst (popups/avian-popups.yml): a gold ring and sparkles, 16 frames of one tick.
avian_levelup:
  type: sequence
  files: [avian_levelup_00.png:1, avian_levelup_01.png:1, avian_levelup_02.png:1, avian_levelup_03.png:1, avian_levelup_04.png:1, avian_levelup_05.png:1, avian_levelup_06.png:1, avian_levelup_07.png:1, avian_levelup_08.png:1, avian_levelup_09.png:1, avian_levelup_10.png:1, avian_levelup_11.png:1, avian_levelup_12.png:1, avian_levelup_13.png:1, avian_levelup_14.png:1, avian_levelup_15.png:1]

# Damage trail: a pale health fill at last_health (health + the last hit), shown briefly under the
# red fill after a hit, so the chunk just lost stays visible for a moment.
avian_fill_trail:
  type: listener
  file: avian_fill_trail.png
  split: 20
  split-type: left
  setting:
    listener:
      class: placeholder
      value: last_health
      max: max_health

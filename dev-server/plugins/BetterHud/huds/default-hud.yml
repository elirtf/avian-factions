# Avian: anchored to the screen centre (gui x 50) with pixel offsets, so the HUD sits the same on
# every screen size. The hotbar spans -91..+91 px; the 81 px bar groups are pinned by their outer
# edges at -106/+106, leaving a 50 px gap in the centre for the 30 px level orb. y is up.
test_hud:
  layouts:
    1:
      name: avian_health
      gui: {x: 50, y: 100}
      pixel: {x: -106, y: -66}
    2:
      name: avian_food
      gui: {x: 50, y: 100}
      pixel: {x: 106, y: -66}
    3:
      name: avian_level
      gui: {x: 50, y: 100}
      pixel: {x: 0, y: -62}

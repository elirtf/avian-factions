# Support and documentation https://factions.support
# Updates https://www.spigotmc.org/resources/factionsuuid.1035/
# 
# Made with love <3
aVeryFriendlyFactionsConfig {
    # Debug
    # Enables some specific extra messages to the log. Typically not useful.
    debug=false
    # This is the config version, used for migrating on plugin updates.
    # Don't change this value yourself, or you could damage all configs!
    version=14
}
commands {
    description {
        # If -1, no limit.
        maxLength=-1
    }
    fly {
        # Warmup seconds before command executes. Set to 0 for no warmup.
        delay=0
        # Should players lose flight status while autoclaiming into territory they cannot fly in?
        disableFlightDuringAutoclaim=false
        # Should we disable flight if the player has suffered generic damage
        disableOnGenericDamage=false
        # Should flight be disabled if the player is hurt by mobs?
        disableOnHurtByMobs=true
        # Should flight be disabled if the player has hurt mobs?
        disableOnHurtingMobs=true
        # Should flight be disabled if the player has hurt players?
        disableOnHurtingPlayers=true
        # True to enable the fly command, false to disable
        enable=true
        # From how far away a player can disable another's flight by being enemy
        # Set to 0 if wanted disable
        # Note: Will produce lag at higher numbers
        enemyRadius=7
        # If a player leaves fly (out of territory or took damage)
        # how long (in seconds) should they not take fall damage for?
        # Set to 0 to have them always take fall damage.
        fallDamageCooldown=3
        # Trails show below the players foot when flying, faction.fly.trails
        # Players can enable them with /f trail on/off
        # Players can also set which effect to show /f trail effect <particle> only if they have faction.fly.trails.<particle>
        particles {
            # Amount spawned
            amount=20
            # Particle color as a hex string. Only relevant if colorRelationally is false and the particle can be colored
            colorARGB=ff008000
            colorRelationally=true
            # How often should we spawn these particles?
            # 0 disables this completely
            spawnRate=0.2
            # Speed of the particles, can be decimal value
            speed=0.02
        }
        # How frequently to check enemy radius, in seconds. Set to 0 to disable checking.
        radiusCheck=1
    }
    home {
        # Warmup seconds before command executes. Set to 0 for no warmup.
        delay=0
    }
    invite {
        # How long, in minutes, before an invite expires. Set to 0 or -1 for no expiration.
        expiry=-1
    }
    kick {
        # If true, players can be kicked while standing in enemy territory
        allowKickInEnemyTerritory=false
    }
    link {
        # Default URL
        defaultURL="No link set"
    }
    map {
        # This will help limit how many times a player can be sent a map of factions.
        # Set this to the cooldown you want, in milliseconds, for a map to be shown to a player.
        # This can prevent some teleportation-based exploits for finding factions.
        # The old default was 2000, which blocks any movement faster than running.
        # The new default is 700, which should also allow boats and horses.
        cooldown=700
    }
    near {
        # Making this radius larger increases lag, do so at your own risk
        # If on a high radius it is advised to add a cooldown to the command
        # Also using {distance} placeholder in the lang would cause more lag on a bigger radius
        radius=20
    }
    seeChunk {
        # Get a list of particle names here: https://factions.support/particles/
        particleName=DUST
        # How often should we update the particles to the current player's location?
        particleUpdateTime=0.75
        # If the chosen particle is compatible with coloring we will color
        # it based on the current chunk's faction
        relationalColor=true
    }
    show {
        # Factions that should be exempt from /f show, case sensitive, useful for a server-team faction
        exempt=[
            "put_faction_tag_here"
        ]
    }
    stuck {
        # Warmup seconds before command executes. Set to 0 for no warmup.
        delay=30
        # This radius defines how far from where they ran the command the player
        # may travel while waiting to be unstuck. If they leave this radius, the
        # command will be cancelled.
        radius=10
        # Search radius allowed for finding safe chunks.
        searchRadius=30
    }
    # TNT bank!
    tnt {
        maxRadius=5
    }
    toolTips {
        # Outdated tooltips - left as reference - removing in a future version
        faction=[
            "&6Leader: &f{leader}",
            "&6Claimed: &f{chunks}",
            "&6Raidable: &f{raidable}",
            "&6Warps: &f{warps}",
            "&6Power: &f{power}/{maxPower}",
            "&6Members: &f{online}/{members}"
        ]
        # Outdated tooltips - left as reference - removing in a future version
        player=[
            "&6Last Seen: &f{lastSeen}",
            "&6Power: &f{player-power}",
            "&6Rank: &f{group}",
            "&6Balance: &a${balance}"
        ]
    }
    warp {
        # Warmup seconds before command executes. Set to 0 for no warmup.
        delay=0
        # Outdated - use the upgrade now. Kept in the short term for lazy config migration.
        maxWarps=5
    }
}
# Data storage settings
data {
    json {
        # If true, data files will be stored without extra whitespace and linebreaks.
        # This becomes less readable, but can cut storage use in half.
        efficientStorage=false
        # If true, even players with the default power will be saved
        saveAllPlayers=false
    }
    # Presently, the only option is JSON.
    storage=JSON
}
# Economy support requires Vault and a compatible economy plugin
# If you wish to use economy features, be sure to set 'enabled' in this section to true!
economy {
    # Faction banks, to pay for land claiming and other costs instead of individuals paying for them
    # This IS NOT the setting for enabling economy features overall. That setting is just named "enabled"
    bankEnabled=true
    # The faction pays for faction command costs, such as sethome
    bankFactionPaysCosts=true
    # The faction pays for land claiming costs.
    bankFactionPaysLandCosts=true
    # If true, the bank balance will transfer to a player leaving a permanent faction that is about to have 0 players in it
    # Set to false to keep the balance in an empty permanent faction
    bankPermanentFactionSendBalanceToLastLeaver=true
    claimAdditionalMultiplier=0.5
    claimRefundMultiplier=0.7
    claimUnconnectedFee=0.0
    costAlly=0.0
    costClaimFromFactionBonus=0.0
    costClaimWilderness=0.0
    costCreate=0.0
    costDTR=0.0
    costDelWarp=0.0
    costDelhome=0.0
    costDesc=0.0
    costEnemy=0.0
    costHome=0.0
    costInvite=0.0
    costJoin=0.0
    costKick=0.0
    costLeave=0.0
    costList=0.0
    costMap=0.0
    costNeutral=0.0
    costNoBoom=0.0
    costOpen=0.0
    costPower=0.0
    costSetWarp=0.0
    costSethome=0.0
    costShow=0.0
    costStuck=0.0
    costTag=0.0
    costTitle=0.0
    costTruce=0.0
    costWarp=0.0
    # This setting matters in particular if you have per-world economy.
    # This setting is the world to use for:
    # faction banks,
    # the universe account (if used),
    # transferring money to a player who is presently offline,
    # or any other situation where the player's world is unknown.
    # 
    # Note that you should set up your per-world plugin to treat all your Factions worlds as one group/world.
    defaultWorld=world
    # Faction dues: each day at midnight, members are charged a daily payment that goes into their faction's bank.
    # Faction admins configure the amounts with "/f set dues".
    # This feature requires both economy ("enabled") and faction banks ("bankEnabled") to be turned on.
    duesEnabled=true
    # How many days into the past a member's missed dues payments are kept and logged, shown by "/f dues".
    # Older missed-payment records are discarded. Set to 0 to disable this logging entirely,
    # which also makes the RECORD dues failure policy have no lasting effect.
    duesMissedPaymentLogDays=30
    # 
    # ******************
    # 
    # The value "enabled" must be true for any economy features
    # Make sure that you confirm the "defaultWorld" setting is a valid world name
    # 
    # ******************
    # 
    enabled=true
    # Locale, language_country, two characters each, must contain both or be rejected
    locale="en_US"
    overclaimRewardMultiplier=0.0
    # Under the DEBT rent failure policy, how many days of missed rent in a row are allowed before the faction is disbanded.
    # Set to 0 to disable automatic disbanding for unpaid rent.
    rentDisbandAfterConsecutiveMissedDays=0
    # Faction rent: each day, right after dues are collected, a faction owes rent paid from its bank based on how much land it has claimed.
    # Requires both economy ("enabled") and faction banks ("bankEnabled").
    rentEnabled=false
    # The equation used to calculate a faction's daily rent, in the same style as upgrade equations.
    # Use 'claims' for the faction's claimed chunk count if you want it based on claims. Example: "10 * claims".
    rentEquation="10 * claims"
    # What to do when a faction bank cannot afford its rent:
    # UNCLAIM_UNTIL_AFFORD - unclaim chunks (starting with the one players have spent the least time in) until the rent is affordable
    # UNCLAIM_ALL - unclaim all of the faction's land
    # DISBAND - disband the faction
    # DEBT - carry the unpaid rent forward as debt, collected in addition next time
    rentFailurePolicy=DEBT
    # Rent gathering accounts are receivers of collected faction rent. Not commonly used.
    rentGatheringAccount=""
    # See the rent gathering account comment. If your economy plugin uses a UUID, add this too
    rentGatheringAccountUUID=""
    # How many days into the past a faction's missed rent payments are kept and logged.
    # Older missed-payment records are discarded. Set to 0 to disable this logging entirely.
    rentMissedPaymentLogDays=30
    # How often (in minutes) every offline player's cached balance is refreshed for "/f top money".
    # Offline players are refreshed gradually across this interval to avoid a burst of economy lookups.
    topBalanceCacheOfflineRefreshMinutes=30
    # The "/f top money" command caches balances instead of querying the economy for every player each time it is run.
    # How often (in seconds) to refresh cached balances of faction banks and online players.
    topBalanceCacheOnlineRefreshSeconds=60
    # Universe accounts are receivers/sources of money in faction transactions. Not commonly used.
    universeAccount=""
    # See the universe account comment. If your economy plugin uses a UUID, and you need a specific one for a universe account, add this too
    universeAccountUUID=""
}
# Controls certain exploit preventions
exploits {
    enderPearlClipping=true
    interactionSpam=false
    # If true, prevents water flow into claimed territory
    liquidFlow=false
    tntWaterlog=false
}
factions {
    chat {
        broadcastDescriptionChanges=false
        broadcastTagChanges=false
        # Allow for players to chat only within their faction, with allies, etc.
        internalChat {
            # Chatting with all faction members
            factionMemberAllChatFormat="[faction-only] <sender:relation_color><sender:role_prefix><sender:faction:name></sender:relation_color> <<sender:name>>: <message>"
            # Chatting with faction members
            factionMemberChatEnabled=true
            # Chatting with all members at or above a role
            factionMemberChatFormat="[<role>+] <sender:relation_color><sender:role_prefix><sender:faction:name></sender:relation_color> <<sender:name>>: <message>"
            # Chatting with faction members
            relationChatEnabled=true
            relationChatFormat="[<relation>-only] <sender:relation_color><sender:role_prefix><sender:faction:name></sender:relation_color> <<sender:name>>: <message>"
            # Prefix to add to chat only seen because the staff member is spying on all chat
            spyingPrefix="[MCspy] "
            # Add items here (comma-separated) for commands to listen to that will auto-return the user to public chat
            triggerPublicChatOnCommand=[]
        }
        # Modern chat handling on Paper servers
        paper {
            # If true, enables this plugin setting public chat formatting as specified in this section.
            # If false, this plugin does not touch public chat.
            enabled=true
            # MiniMessage representation of chat format.
            # 
            # <message> is the player-sent message content
            # <sender> is the player
            formatHasFaction="<sender:relation_color><sender:role_prefix><sender:faction:name></sender:relation_color> <<sender:name>> <message>"
            formatNoFaction="<<sender:name>> <message>"
        }
        # Legacy chat handling on Spigot servers
        spigot {
            alwaysShowChatTag=true
            tagFormat="%s§f"
            # If true, disables adding of faction tag so another plugin can manage this
            tagHandledByAnotherPlugin=false
            tagInsertAfterString=""
            tagInsertBeforeString=""
            tagInsertIndex=0
            tagNoFaction="§6[§ano-faction§6]§r"
            tagPadAfter=true
            tagPadBefore=false
            tagRelationColored=true
            tagReplaceString="[FACTION]"
        }
    }
    claims {
        # Should we allow Factions to over claim if they are raidable?
        # This has always been true, allowing factions to over claim others.
        allowOverClaim=true
        # If true (and allowOverClaim is true, claiming over another faction's land will ignore buffer zone settings.
        allowOverClaimIgnoringBuffer=false
        # Buffer Zone is an chunk area required between claims of different Factions.
        # This is default to 0 and has always been that way. Meaning Factions can have
        #  claims that border each other.
        # If this is set to 3, then Factions need to have 3 chunks between their claim
        #  and another Faction's claim.
        # It's recommended to keep this pretty low as the radius check could be a
        #  heavy operation if set to a large number.
        # If this is set to 0, we won't even bother checking which is how Factions has
        #  always been.
        bufferZone=0
        canBeUnconnectedIfOwnedByOtherFaction=true
        # The maximum width, in chunks, allowed across a single contiguous claim for a normal faction.
        # 
        # Set to 0 to disable this check.
        contiguousDistance=0
        # The maximum number of chunks allowed in a single contiguous claim for a normal faction.
        # 
        # Set to 0 to disable this check.
        contiguousTotalChunks=0
        fillClaimMaxClaims=25
        fillClaimMaxDistance=5
        fillUnClaimMaxClaims=25
        fillUnClaimMaxDistance=5
        landsMax=0
        mustBeConnected=false
        # If someone is doing a radius claim and the process fails to claim land this many times in a row, it will exit
        radiusClaimFailureLimit=9
        requireMinFactionMembers=1
        worldsNoClaiming=[
            exampleWorldName
        ]
    }
    # Should we send titles when players enter Factions? Durations are in ticks (20 ticks every second)
    enterTitles {
        alsoShowChat=false
        enabled=true
        fadeIn=10
        fadeOut=20
        stay=70
    }
    homes {
        enabled=true
        mustBeInClaimedTerritory=true
        requiredToHaveHomeBeforeSettingWarps=false
        # Seconds of invulnerability granted after respawning at the faction home following a death.
        # Makes spawn-camping a bit harder.
        # Set to 0 to disable.
        respawnInvulnerabilitySeconds=0
        teleportAllowedEnemyDistance=32.0
        teleportAllowedFromDifferentWorld=true
        teleportAllowedFromEnemyTerritory=true
        teleportCommandEnabled=true
        teleportCommandEssentialsIntegration=false
        teleportCommandSmokeEffectEnabled=true
        teleportCommandSmokeEffectThickness=3
        teleportIgnoreEnemiesIfInOwnTerritory=true
        teleportToOnDeath=true
    }
    landRaidControl {
        # Announce in chat if a faction becomes no longer raidable?
        announceNotRaidable=false
        # Announce in chat if a faction becomes raidable?
        announceRaidable=false
        # If either announce on raidable or not raidable is true, only send to the faction and its enemies.
        # If false, sends to all players.
        announceToEnemyOnly=false
        # Controls the DTR system of land/raid control
        # Set the 'system' value to 'dtr' to use this system
        dtr {
            decimalDigits=2
            # If true, the DTR loss reduction upgrade also reduces how much DTR a killer steals via vampirism.
            # If false, vampirism is based on the full DTR loss, ignoring the reduction.
            dtrLossReductionAffectsVampirism=false
            freezeKickPenalty=0.5
            freezePreventsDisband=true
            freezePreventsJoin=true
            freezePreventsLeave=true
            # Time, in seconds, to freeze DTR regeneration after a faction member dies
            freezeTime=0
            freezeTimeFormat="H:mm:ss"
            # Additional claims allowed for each player in the faction
            landPerPlayer=3
            # Claims the faction starts with.
            # Note: A faction of one player has this many PLUS the perPlayer amount.
            landStarting=6
            lossPerDeath=1.0
            maxDTR=10.0
            minDTR=-3.0
            perPlayer=1.0
            regainPerMinuteMaxRate=0.1
            regainPerMinutePerPlayer=0.05
            startingDTR=2.0
            # DTR stealing. 0 to disable, 1 to give the killing player's faction all of the target player's faction's lost DTR,
            # 0.5 to give the killing faction half of what was lost, etc.
            # Negative values will give the incredibly wild option of taking DTR from the killer's faction too.
            vampirism=0.0
            worldDeathModifiers {
                "world_nether"=0.5
                "world_the_end"=0.25
            }
        }
        # Controls the power system of land/raid control
        # Set the 'system' value to 'power' to use this system
        power {
            # Disallow joining/leaving/kicking while power is negative
            canLeaveWithNegativePower=true
            # If greater than 0, used as a cap for how much power a faction can have
            # Additional power from players beyond this acts as a "buffer" of sorts
            factionMax=0.0
            # How much is lost on death
            lossPerDeath=2.0
            # A player stops losing power from being offline once they reach this amount
            offlineLossLimit=0.0
            # A player loses this much per day offline
            offlineLossPerDay=0.0
            peacefulMembersDisablePowerLoss=true
            playerMax=20.0
            playerMin=0.0
            playerStarting=20.0
            # After a player dies, how long should the faction not be able to regen power?
            # This resets on each death but does not accumulate.
            # Set to 0 for no freeze. Time is in seconds.
            powerFreeze=0
            # If true, the power loss reduction upgrade also reduces how much power a killer steals via vampirism.
            # If false, vampirism is based on the full power loss, ignoring the reduction.
            powerLossReductionAffectsVampirism=false
            # Default health rate of 0.2 takes 5 minutes to recover one power
            powerPerMinute=0.0166667
            # Allow a faction to be raided if they have more land than power.
            # This will make claimed territory lose all protections
            #  allowing factions to open chests, break blocks, etc. if they
            #  have more claimed chunks (land) than power. (See raidabilityOnEqualLandAndPower)
            raidability=true
            # Determines if the requirement for raidability is land>=power (true) or
            # land>power (false)
            raidabilityOnEqualLandAndPower=false
            # Does a player regenerate power while offline?
            regenOffline=false
            respawnHomeFromNoPowerLossWorlds=true
            # Power stealing. 0 to disable, 1 to give the killing player all of the target player's lost power,
            # 0.5 to give the killing player half of what was lost, etc.
            # Negative values will give the incredibly wild option of taking power from the killer too.
            vampirism=0.0
            warZonePowerLoss=true
            wildernessPowerLoss=true
            worldsNoPowerLoss=[
                exampleWorld
            ]
        }
        # 
        # Sets the mode of land/raid control
        system=power
    }
    # Limits factions to having a max number of each relation.
    # Setting to 0 means none allowed. -1 for disabled.
    # This will have no effect on default or existing relations, only when relations are changed.
    # It is advised that you set the default relation to -1 so they can always go back to that.
    # Otherwise Factions could be stuck with not being able to unenemy other Factions.
    maxRelations {
        ally=10
        enabled=false
        enemy=10
        neutral=-1
        truce=10
    }
    # Remaining settings not categorized
    other {
        actionDeniedPainAmount=1
        allowMultipleColeaders=false
        # If anything greater than 0 (can be decimal values like 0.1), players will automatically leave their faction
        # after being inactive for this many days.
        autoLeaveAfterDaysOfInactivity=0.0
        autoLeaveDeleteFPlayerData=true
        # If true, autoleave only processes on players if all faction members meet the inactivity criteria.
        autoLeaveOnlyEntireFactionInactive=false
        autoLeaveRoutineMaxMillisecondsPerTick=5
        autoLeaveRoutineRunsEveryXMinutes=5.0
        considerFactionsReallyOfflineAfterXMinutes=0.0
        # Default greeting for zones. The <tag> tag auto-updates the faction tag.
        defaultGreeting="<tag> welcomes you!"
        # Default Relation allows you to change the default relation for Factions.
        # Example usage would be so people can't leave then make a new Faction while Raiding
        #  in order to be able to execute commands if the default relation is neutral.
        defaultRelation=neutral
        # Default role of a player when joining a faction. Can be customized by faction leader
        # with /f defaultrole
        # Options: coleader, moderator, member, recruit
        # Defaults to member if set incorrectly
        defaultRole=member
        # Should we delete player homes that they set via Essentials when they leave a Faction
        # if they have homes set in that Faction's territory?
        deleteEssentialsHomes=true
        # If true, disables pistons entirely within faction territory.
        # Prevents flying piston machines in faction territory.
        disablePistonsInTerritory=false
        # AVIAN: 10 (HCF-style small teams, docs/research/hcf-patterns.md). The max_members upgrade stays
        # off (factions.conf), so this is a hard cap. When membership hits it, /f join (and accepting
        # an invite) is refused; default is 0, no limit
        factionMemberLimit=10
        # Any faction names CONTAINING any of these items will be disallowed
        nameBlacklist=[
            blockedwordhere,
            anotherblockedthinghere
        ]
        newFactionsDefaultOpen=false
        newFactionsDefaultPeaceful=false
        # What faction ID to start new players in when they first join the server; default is 0, "no faction"
        newPlayerStartingFactionID=0
        saveToFileEveryXMinutes=30.0
        tagForceUpperCase=false
        # Maximum faction tag length
        tagLengthMax=10
        # Minimum faction tag length
        tagLengthMin=3
        tagValidCharacters="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
        # Maximum member title length
        titleLengthMax=64
    }
    # Do you want to limit portal creation?
    portals {
        # If true, portals will be limited to the minimum relation below
        limit=false
        # What should the minimum relation be to create a portal in territory?
        # Goes in the order of: ENEMY, NEUTRAL, ALLY, MEMBER.
        # Minimum relation allows that and all listed to the right to create portals.
        # Example: put ALLY to allow ALLY and MEMBER to be able to create portals.
        # If typed incorrectly, defaults to NEUTRAL.
        minimumRelation=MEMBER
    }
    # Displayed prefixes for different roles within a faction
    prefixes {
        admin="***"
        coleader="**"
        mod="*"
        normal="+"
        recruit="-"
    }
    protection {
        # Exceptions to consideration for breaking perms. Can always be broken.
        breakExceptions=[]
        # Exceptions to consideration for container perms.
        # For example, putting "TRAPPED_CHEST" into here would allow anyone to open trapped chests anywhere.
        containerExceptions=[]
        # Add material names here that you wish to see treated as containers for interaction.
        customContainers=[]
        # Exceptions for protections of interacting with entities, such as mounting horses
        entityInteractExceptions=[]
        # Enables the 'grace' system, preventing explosions for a period of time, across the server, as defined by the admin setting it.
        graceSystem=true
        peacefulBlockAllEntityDamage=false
        # Commands which will be prevented if the player is a member of a permanent faction
        permanentFactionMemberDenyCommands=[
            exampleCommand
        ]
        pistonProtectionThroughDenyBuild=true
        # Mainly for other plugins/mods that use a fake player to take actions, which shouldn't be subject to our protections.
        playersWhoBypassAllProtection=[
            example-player-name
        ]
        safeZoneBlockAllEntityDamage=false
        safeZoneBlockOtherExplosions=true
        safeZoneBlockTNT=true
        safeZoneBlockWindCharge=true
        safeZoneDenyBuild=true
        safeZoneDenyEndermanBlocks=true
        safeZoneDenyUsage=true
        safeZonePreventAllDamageToPlayers=false
        safeZonePreventLiquidFlowIn=true
        # If true, lecterns can be interacted with, but taking the book will still be protected by CONTAINER perm
        territoryAllowLecternReading=false
        # Commands which will be prevented when in claimed territory of an ally faction
        territoryAllyDenyCommands=[
            exampleCommand
        ]
        territoryBlockCreepers=false
        territoryBlockCreepersWhenOffline=false
        territoryBlockEntityDamageMatchingPerms=false
        territoryBlockFireballs=false
        territoryBlockFireballsWhenOffline=false
        territoryBlockOtherExplosions=false
        territoryBlockOtherExplosionsWhenOffline=false
        territoryBlockTNT=false
        territoryBlockTNTWhenOffline=false
        territoryBlockWindCharge=false
        # Blocks wind charge use to activate doors/levers/buttons etc. if lacking permission
        territoryBlockWindChargeInteractionMatchingPerms=false
        territoryBlockWindChargeWhenOffline=false
        territoryDenyEndermanBlocks=true
        territoryDenyEndermanBlocksWhenOffline=true
        territoryDenyIceFormation=false
        territoryDenyUsageMaterials=[
            "AXOLOTL_BUCKET",
            "TADPOLE_BUCKET",
            "SALMON_BUCKET",
            "PUFFERFISH_BUCKET",
            "FLINT_AND_STEEL",
            "COD_BUCKET",
            BUCKET,
            "LAVA_BUCKET",
            "WATER_BUCKET",
            "FIRE_CHARGE",
            "TROPICAL_FISH_BUCKET"
        ]
        territoryDenyUsageMaterialsWhenOffline=[
            "AXOLOTL_BUCKET",
            "TADPOLE_BUCKET",
            "SALMON_BUCKET",
            "PUFFERFISH_BUCKET",
            "FLINT_AND_STEEL",
            "COD_BUCKET",
            BUCKET,
            "LAVA_BUCKET",
            "WATER_BUCKET",
            "FIRE_CHARGE",
            "TROPICAL_FISH_BUCKET"
        ]
        # Commands which will be prevented when in claimed territory of an enemy faction
        territoryEnemyDenyCommands=[
            spawn,
            tpa,
            sethome,
            tpahere,
            tpaccept,
            home
        ]
        # Commands which will be prevented when in claimed territory of a neutral faction
        territoryNeutralDenyCommands=[
            exampleCommand
        ]
        # Teleport joining players (or arriving from a plugin-disabled world) out of
        # territories (such as enemy territory) back to a designated location.
        territoryTeleport {
            # Destination options. Order them, separated by commas, for priority.
            # For example, if a faction home does not exist then the next option is chosen.
            # Absolute fallback is the spawn of the first world loaded
            # Options:
            #  home: Faction home
            #  bed: Bed
            destination="home, bed, spawn"
            # The world in which the spawn exists
            destinationSpawnWorld=world
            enable=false
            # Should safezone count if NEUTRAL is listed as a relation?
            "includeSafezoneInNeutral"=false
            # Should warzone count if NEUTRAL is listed as a relation?
            "includeWarzoneInNeutral"=false
            # Should wilderness count if NEUTRAL is listed as a relation?
            "includeWildernessInNeutral"=false
            # Options: MEMBER, ALLY, TRUCE, NEUTRAL, ENEMY
            # Incorrectly spelled entries default to NEUTRAL
            relationsToTeleportOut=[
                ENEMY,
                NEUTRAL,
                TRUCE
            ]
            # Time, in seconds, since last on the server to trigger this feature.
            timeSinceLastSignedIn=300
        }
        # Commands which will be prevented when in claimed territory of a truced faction
        territoryTruceDenyCommands=[
            exampleCommand
        ]
        warZoneBlockCreepers=true
        warZoneBlockFireballs=true
        warZoneBlockOtherExplosions=true
        warZoneBlockTNT=true
        warZoneBlockWindCharge=true
        warZoneDenyBuild=true
        warZoneDenyEndermanBlocks=true
        warZoneDenyUsage=true
        warZoneFriendlyFire=false
        warZonePreventLiquidFlowIn=true
        # Commands which will be prevented when in warzone
        warzoneDenyCommands=[
            exampleCommand
        ]
        wildernessBlockCreepers=false
        wildernessBlockFireballs=false
        wildernessBlockOtherExplosions=false
        wildernessBlockTNT=false
        wildernessBlockWindCharge=false
        wildernessDenyBuild=false
        # Commands which will be prevented when in wilderness
        wildernessDenyCommands=[
            exampleCommand
        ]
        wildernessDenyEndermanBlocks=false
        wildernessDenyUsage=false
        worldsNoWildernessProtection=[
            exampleWorld
        ]
    }
    pvp {
        # If true, the "damage attempted" warning normally sent to a defender is suppressed when the attacker is vanished
        disableNotificationWhenAttackerVanished=true
        disablePVPBetweenNeutralFactions=false
        disablePVPForFactionlessPlayers=false
        disablePeacefulPVPInWarzone=true
        enablePVPAgainstFactionlessInAttackersLand=false
        noPVPDamageToOthersForXSecondsAfterLogin=3
        worldsIgnorePvP=[
            exampleWorldName
        ]
    }
    # Spawn control.
    # Exception names are entity type names as seen at the below URL.
    # Note that any name with an underscore MUST have quotes around it.
    # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
    # Spawn types are those at the below URL:
    # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/event/entity/CreatureSpawnEvent.SpawnReason.html
    spawning {
        preventSpawningInSafezone=[
            "OCELOT_BABY",
            REINFORCEMENTS,
            "VILLAGE_DEFENSE",
            "DISPENSE_EGG",
            "ENDER_PEARL",
            EXPLOSION,
            TRAP,
            "SILVERFISH_BLOCK",
            NATURAL,
            BREEDING,
            INFECTION,
            "BUILD_WITHER",
            MOUNT,
            "BUILD_SNOWMAN",
            DROWNED,
            EGG,
            CURED,
            LIGHTNING,
            RAID,
            SPAWNER,
            "SLIME_SPLIT",
            PATROL,
            "BUILD_IRONGOLEM",
            "NETHER_PORTAL",
            "VILLAGE_INVASION",
            "SPAWNER_EGG",
            DEFAULT
        ]
        preventSpawningInSafezoneExceptions=[
            MULE,
            LLAMA,
            SHEEP,
            "TROPICAL_FISH",
            VILLAGER,
            "POLAR_BEAR",
            "MUSHROOM_COW",
            CHICKEN,
            TURTLE,
            COD,
            "TRADER_LLAMA",
            "GLOW_SQUID",
            PUFFERFISH,
            SQUID,
            HORSE,
            PARROT,
            COW,
            "WANDERING_TRADER",
            FOX,
            AXOLOTL,
            PIG,
            BAT,
            DOLPHIN,
            CAT,
            SALMON,
            RABBIT,
            WOLF,
            DONKEY,
            STRIDER,
            "IRON_GOLEM",
            PANDA,
            OCELOT
        ]
        preventSpawningInTerritory=[]
        preventSpawningInTerritoryExceptions=[]
        preventSpawningInWarzone=[]
        preventSpawningInWarzoneExceptions=[]
        preventSpawningInWilderness=[]
        preventSpawningInWildernessExceptions=[]
        # If true, FactionsUUID will automatically add in its new defaults such as
        # adding new friendly mobs to the safe zone exception list
        updateAutomatically=true
    }
    specialCase {
        # Material names of things whose placement is ignored in faction territory
        ignoreBuildMaterials=[
            exampleMaterial
        ]
        peacefulTerritoryDisableBoom=false
        peacefulTerritoryDisableMonsters=false
        peacefulTerritoryDisablePVP=true
        permanentFactionsDisableLeaderPromotion=false
    }
}
# What should be logged?
logging {
    factionCreate=true
    factionDisband=true
    factionJoin=true
    factionKick=true
    factionLeave=true
    landClaims=true
    landUnclaims=true
    moneyTransactions=true
    # Log blocked player commands, specifically
    playerCommands=true
}
# Control for the default settings of /f map
map {
    height=7
    scoreboardHeight=7
    scoreboardWidth=7
    selfColor="#89d6d2"
    showEnemyFactions=true
    showFactionKey=true
    showNeutralFactionsOnMap=true
    showTruceFactions=true
    width=49
}
# Lists plugin integrations. Some other plugins (PVX, Magic, WG, WB) are currently
# elsewhere but will migrate here in the future
plugins {
    # General plugin support
    general {
        # If true, prevents regeneration of dtr/power while marked as AFK.
        # By default, EssX support is added, but other plugins can add support for this.
        # Reach out if you have a plugin you want support added for!
        preventRegenWhileAfk=false
    }
    # Ranull's Graves plugin
    graves {
        # If true, will allow any Graves plugin graves to be opened by anyone, regardless of permissions
        allowAnyoneToOpenGraves=false
        preventGravesInSafezone=false
        preventGravesInWarzone=false
    }
    magic {
        # If true, magic mobs will follow whatever pvp allowed/disallowed setting is present for the territory they're attacking into.
        usePVPSettingForMagicMobs=false
    }
    # PlayerVaults faction vault settings.
    # Enable faction-owned vaults!
    # https://www.spigotmc.org/resources/playervaultsx.51204/
    playerVaults {
        # The %s is for the faction id
        vaultPrefix="faction-%s"
    }
    # WorldGuard settings.
    worldGuard {
        # If true, allows building in a WG region where the player has the BUILD flag
        buildPriority=false
        # If true, disallows claiming a chunk if any WG region is at least partially inside the chunk
        checking=true
        # If true, disallows claiming a chunk if any WG region with the flag 'fuuid-claim' denied for the claiming player is at least partially inside the chunk
        checkingFlag=false
        # If true, allows pvp in a WG region where the flag `fuuid-pvp` is allowed
        pvpPriority=false
    }
}
restrictWorlds {
    # If true, Factions will only function on certain worlds
    restrictWorlds=false
    # If restrictWorlds is true, this setting determines if the world list below is a whitelist or blacklist.
    # True for whitelist, false for blacklist.
    whitelist=true
    worldList=[
        exampleWorld
    ]
}
scoreboard {
    # Constant scoreboard stays around all the time, displaying status info.
    # Also, if prefixes are enabled while it is enabled, will show prefixes on nametags and tab
    constant {
        enabled=false
        factionlessEnabled=false
        # If true, show configured prefixes on nametags and in tab list if this scoreboard is enabled
        prefixes=true
        # If true, show configured suffixes on nametags and in tab list if this scoreboard is enabled
        suffixes=false
    }
    # Info scoreboard is displayed when a player walks into a new Faction's territory.
    # Scoreboard disappears after <expiration> seconds.
    info {
        # Send faction change message as well when scoreboard is up?
        alsoSendChat=true
        enabled=false
        # How long do we want scoreboards to stay
        expiration=7
    }
}
worldBorder {
    # WorldBorder support
    # This is for Minecraft's built-in command. To get your current border: /minecraft:worldborder get
    # A buffer of 0 means faction claims can go right up to the border of the world.
    # The buffer is in chunks, so 1 as a buffer means an entire chunk of buffer between
    # the border of the world and what can be claimed to factions
    buffer=0
}

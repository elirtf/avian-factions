scoreboard {
    # Constant scoreboard stays around all the time, displaying status info.
    # Also, if prefixes are enabled while it is enabled, will show prefixes on nametags and tab
    constant {
        factionlessContent=[
            "<golden>Not in a faction",
            "",
            "<info>Join a faction",
            "<info>  or make your own!"
        ]
        factionlessTitle=Status
        normalContent=[
            "<fuuid:color:relation:member><faction:name>",
            "<info>Role: <focus><player:role_name>",
            "",
            "<info><fuuid:if_power>Your Power: <focus><player:power></fuuid:if_power><fuuid:if_dtr>DTR: <focus><faction:dtr></focus>/<focus><faction:dtr_max></focus></fuuid:if_dtr>",
            "",
            "<golden>    Map",
            "<player:scoreboard_map:1>",
            "<player:scoreboard_map:2>",
            "<player:scoreboard_map:3>",
            "<player:scoreboard_map:4>",
            "<player:scoreboard_map:5>",
            "<player:scoreboard_map:6>",
            "<player:scoreboard_map:7>"
        ]
        # Can use any placeholders, but does not update once set
        normalTitle="<golden>Your Faction"
        # Supports <faction:relation_color>, <faction:name>
        prefixTemplate="<faction:relation_color>[<faction:name>] </faction:relation_color> "
        # Supports <faction:relation_color>, <faction:name>
        suffixTemplate=" <faction:relation_color>[<faction:name>]"
    }
    # Info scoreboard is displayed when a player walks into a new faction's territory.
    # Scoreboard disappears after <expiration> seconds.
    info {
        # Supports <player>, <faction>
        content=[
            "<info>Power",
            "<faction:power>",
            "<info>Members",
            "<faction:members_online_count>/<faction:members_total_count>",
            "<info>Leader",
            "<faction:leader>",
            "<info>Territory",
            "<faction:claims_count>"
        ]
        # Supports <faction>
        title="<faction>"
    }
}

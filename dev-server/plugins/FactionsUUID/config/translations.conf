# This config file is the location for all text content
# All information here uses MiniMessage. https://docs.papermc.io/adventure/minimessage/
aColorfulMessage {
    # Custom color names so you can more easily re-style.
    # Here are the defaults:
    # 
    # info: Normal info
    # focus: Gently highlight items within an info message.
    # 
    # deny: Rejection
    # denyfocus: Gently highlight items within a deny message.
    # 
    # positive: Positive
    # currently used for a few enabled statuses
    # 
    # negative: Not rejection but still a negative thing
    # negativefocus: Gently highlight within a negative message
    # Note that these are the same color as deny by default
    # 
    # golden: A gold that fits with the others
    # goldenfocus: Gently highlight within a golden message
    # 
    # titling: A color used in the title for <title>
    # 
    colors {
        deny="#ffb4ab"
        denyfocus="#ffdad6"
        focus="#acedff"
        golden="#e6c36c"
        goldenfocus="#ffdf95"
        info="#85d2e7"
        negative="#ffb4ab"
        negativefocus="#ffdad6"
        positive="#8ad6b7"
        titling="#6ce677"
    }
    # Define your own custom names and colors here, to make them valid for MiniMessage strings in this plugin!
    # Names must be lowercase and can not be one of the other names
    customColors {}
    factions {
        safezone="#87e8de"
        warzone="#e6b46c"
        wilderness="#91d689"
    }
    help {
        accent="dark_gray"
        alternateHighlight="#91d689"
        highlight=titling
        primary=golden
        text=goldenfocus
    }
    relations {
        ally="#f0b3e7"
        enemy="#ff8b81"
        member="#6ce677"
        neutral="#dee3e5"
        peaceful="#ffdf95"
        truce="#cebdfe"
    }
}

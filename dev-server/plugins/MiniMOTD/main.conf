# AVIAN: the server-list message (MiniMOTD). Just the name: bright, nothing else.
# The server icon comes later (plugins/MiniMOTD/icons/).
icon-enabled=false
motd-enabled=true
motds=[
    {
        icon=random
        line1="<bold><gradient:#FFD23F:#FF7A45>✦ AVIAN FACTIONS ✦</gradient></bold>"
        line2=""
    }
]
player-count-settings {
    # The server list shows "<online>/1". Display only: the real limit is max-players in
    # server.properties (20), which is untouched.
    max-players=1
    max-players-enabled=true
    # Keep showing "/1" even with more players online ("3/1"), rather than raising the number shown.
    allow-exceeding-maximum=true
}

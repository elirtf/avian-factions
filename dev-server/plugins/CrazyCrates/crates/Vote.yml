# Avian crate: Vote. Virtual: opened from /crates with keys held on the player (no crate block, so
# it works in whichever world spawn ends up in). Weights are relative; the preview shows each chance.
# Rewards scale with docs/ECONOMY.md: tokens run ~20-40 an hour of farming, a diamond set is $90k.
Crate:
  CrateType: CSGO
  StartingKeys: 0
  RequiredKeys: 0
  Max-Mass-Open: 10
  InGUI: true
  Slot: 13
  OpeningBroadCast: false
  BroadCast: "<#FFD23F>✦</#FFD23F> <white>%player%</white> <#B8B8C8>is opening a</#B8B8C8> <bold><#7FD8FF>Vote Crate</#7FD8FF></bold>"
  opening-command:
    toggle: false
    commands: []
  sound:
    cycle-sound: {toggle: true, value: "block.note_block.pling", volume: 0.6, pitch: 1.4}
    click-sound: {toggle: true, value: "ui.button.click", volume: 1.0, pitch: 1.0}
    stop-sound: {toggle: true, value: "entity.player.levelup", volume: 1.0, pitch: 1.2}
  Prize-Message:
    - "<#FFD23F>✦</#FFD23F> <#B8B8C8>You won</#B8B8C8> <white>%reward%</white> <#B8B8C8>from the</#B8B8C8> <#7FD8FF>Vote Crate</#7FD8FF><#B8B8C8>!</#B8B8C8>"
  Prize-Commands: []
  Settings:
    Tracking-Crate-Opening: false
    Knock-Back: true
    Disabled-Worlds: []
    Requirements:
      Key:
        Sound: {Toggle: true, Name: "entity.villager.no"}
    Border:
      Glass-Border: {Toggle: true, Air: true}
    CSGO:
      Finished-Material: "lime_stained_glass_pane"
      Cycle-Material: "purple_stained_glass_pane"
    Broadcast:
      Toggle: false
      Messages: []
      Permission: ""
    Rewards:
      Re-Roll-Spin: false
      Permission: {Toggle: false, Persist: false, Max-Cap: 20}
  Item: "paper"
  Hide-Flags: true
  Components: []
  Custom-Model-Data: -1
  Model: {Namespace: "", Id: ""}
  Glowing: "add_glow"
  Name: "<bold><#7FD8FF>Vote Crate</#7FD8FF></bold>"
  Lore:
    - "<#B8B8C8>A thank-you for voting. Small, frequent, useful.</#B8B8C8>"
    - ""
    - "<#6E6E80>◆</#6E6E80> <#B8B8C8>Keys</#B8B8C8>  <white>%keys%</white>"
    - "<#6E6E80>◆</#6E6E80> <#B8B8C8>Opened</#B8B8C8>  <white>%crate_opened%</white>"
    - ""
    - "<#7CFF4F>▶</#7CFF4F> <#B8B8C8>Left-click · open with a key</#B8B8C8>"
    - "<#7CFF4F>▶</#7CFF4F> <#B8B8C8>Right-click · see every prize</#B8B8C8>"
  Preview:
    Name: "<bold><#7FD8FF>Vote Crate</#7FD8FF></bold> <#6E6E80>· prizes</#6E6E80>"
    Toggle: true
    Rows: 6
    Glass:
      Toggle: true
      Name: " "
      Item: "black_stained_glass_pane"
      Custom-Model-Data: -1
      Model: {Namespace: "", Id: ""}
  Animation:
    Name: "<#7FD8FF>Rolling…</#7FD8FF>"
    Glass-Frame:
      Toggle: true
      Items: {"1": {name: " ", lore: [], material: "purple_stained_glass_pane", amount: 1}}
      Random:
        Toggle: true
        Items:
          "1": {name: " ", lore: [], material: "magenta_stained_glass_pane", amount: 1}
          "2": {name: " ", lore: [], material: "light_blue_stained_glass_pane", amount: 1}
          "3": {name: " ", lore: [], material: "yellow_stained_glass_pane", amount: 1}
  PhysicalKey:
    Name: "<bold><#7FD8FF>Vote Key</#7FD8FF></bold>"
    Lore:
      - "<#B8B8C8>Opens one Vote Crate in /crates.</#B8B8C8>"
    Item: "tripwire_hook"
    Custom-Model-Data: -1
    Model: {Namespace: "", Id: ""}
    Glowing: "add_glow"
    flags: {components: []}
  Hologram:
    Toggle: false
    Height: 1.5
    Range: 8
    Update-Interval: -1
    Color: "transparent"
    TextShadow: false
    Message: ["<bold><#7FD8FF>Vote Crate</#7FD8FF></bold>"]
  Prizes:
    "1":
      DisplayName: "<bold><#4CE08A>$1,000</#4CE08A></bold>"
      DisplayItem: "gold_ingot"
      DisplayAmount: 1
      Weight: 30
      Commands: ["eco give %player% 1000"]
    "2":
      DisplayName: "<bold><#4CE08A>$2,500</#4CE08A></bold>"
      DisplayItem: "gold_ingot"
      DisplayAmount: 1
      Weight: 15
      Commands: ["eco give %player% 2500"]
    "3":
      DisplayName: "<bold><#FFE66D>10 Tokens</#FFE66D></bold>"
      DisplayItem: "sunflower"
      DisplayAmount: 1
      Weight: 20
      Commands: ["tokens give %player% 10 crate:vote"]
    "4":
      DisplayName: "<bold><#FFE66D>25 Tokens</#FFE66D></bold>"
      DisplayItem: "sunflower"
      DisplayAmount: 1
      Weight: 10
      Commands: ["tokens give %player% 25 crate:vote"]
    "5":
      DisplayName: "<#7FD8FF>16× Golden Carrot</#7FD8FF>"
      DisplayItem: "golden_carrot"
      DisplayAmount: 16
      Weight: 10
      Items:
        "1":
          material: "golden_carrot"
          amount: 16
    "6":
      DisplayName: "<#7FD8FF>16× Iron Ingot</#7FD8FF>"
      DisplayItem: "iron_ingot"
      DisplayAmount: 16
      Weight: 10
      Items:
        "1":
          material: "iron_ingot"
          amount: 16
    "7":
      DisplayName: "<#7FD8FF>8× Bottle o' Enchanting</#7FD8FF>"
      DisplayItem: "experience_bottle"
      DisplayAmount: 8
      Weight: 8
      Items:
        "1":
          material: "experience_bottle"
          amount: 8
    "8":
      DisplayName: "<bold><#C9C9C9>1× Common Key</#C9C9C9></bold>"
      DisplayItem: "tripwire_hook"
      DisplayAmount: 1
      DisplayGlowing: true
      Weight: 5
      Commands: ["crates give virtual Common 1 %player% -s"]
    # The Cosmetics crate's free route (owner, 2026-09-29).
    "9":
      DisplayName: "<bold><#FF4FD8>1× Cosmetic Key</#FF4FD8></bold>"
      DisplayItem: "tripwire_hook"
      DisplayLore: ["<#B8B8C8>Opens a Cosmetics Crate: a chat tag or a pet.</#B8B8C8>"]
      DisplayAmount: 1
      DisplayGlowing: true
      Weight: 6
      Commands: ["crates give virtual Cosmetic 1 %player% -s"]
      Firework: true

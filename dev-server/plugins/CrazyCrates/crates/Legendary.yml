# Avian crate: Legendary. Virtual: opened from /crates with keys held on the player (no crate block, so
# it works in whichever world spawn ends up in). Weights are relative; the preview shows each chance.
# Rewards scale with docs/ECONOMY.md: tokens run ~20-40 an hour of farming, a diamond set is $90k.
Crate:
  CrateType: CSGO
  StartingKeys: 0
  RequiredKeys: 0
  Max-Mass-Open: 10
  InGUI: true
  Slot: 23
  OpeningBroadCast: true
  BroadCast: "<#FFD23F>✦</#FFD23F> <white>%player%</white> <#B8B8C8>is opening a</#B8B8C8> <bold><#FFB84D>Legendary Crate</#FFB84D></bold>"
  opening-command:
    toggle: false
    commands: []
  sound:
    cycle-sound: {toggle: true, value: "block.note_block.pling", volume: 0.6, pitch: 1.4}
    click-sound: {toggle: true, value: "ui.button.click", volume: 1.0, pitch: 1.0}
    stop-sound: {toggle: true, value: "entity.player.levelup", volume: 1.0, pitch: 1.2}
  Prize-Message:
    - "<#FFD23F>✦</#FFD23F> <#B8B8C8>You won</#B8B8C8> <white>%reward%</white> <#B8B8C8>from the</#B8B8C8> <#FFB84D>Legendary Crate</#FFB84D><#B8B8C8>!</#B8B8C8>"
  Prize-Commands: []
  Settings:
    Tracking-Crate-Opening: false
    Knock-Back: true
    Disabled-Worlds: []
    Requirements:
      Key:
        Sound: {Toggle: true, Name: "entity.villager.no"}
    Border:
      Glass-Border: {Toggle: true, Air: true}
    CSGO:
      Finished-Material: "lime_stained_glass_pane"
      Cycle-Material: "purple_stained_glass_pane"
    Broadcast:
      Toggle: false
      Messages: []
      Permission: ""
    Rewards:
      Re-Roll-Spin: false
      Permission: {Toggle: false, Persist: false, Max-Cap: 20}
  Item: "orange_shulker_box"
  Hide-Flags: true
  Components: []
  Custom-Model-Data: -1
  Model: {Namespace: "", Id: ""}
  Glowing: "add_glow"
  Name: "<bold><#FFB84D>Legendary Crate</#FFB84D></bold>"
  Lore:
    - "<#B8B8C8>Netherite, blaze spawners and the rarest apples.</#B8B8C8>"
    - ""
    - "<#6E6E80>◆</#6E6E80> <#B8B8C8>Keys</#B8B8C8>  <white>%keys%</white>"
    - "<#6E6E80>◆</#6E6E80> <#B8B8C8>Opened</#B8B8C8>  <white>%crate_opened%</white>"
    - ""
    - "<#7CFF4F>▶</#7CFF4F> <#B8B8C8>Left-click · open with a key</#B8B8C8>"
    - "<#7CFF4F>▶</#7CFF4F> <#B8B8C8>Right-click · see every prize</#B8B8C8>"
  Preview:
    Name: "<bold><#FFB84D>Legendary Crate</#FFB84D></bold> <#6E6E80>· prizes</#6E6E80>"
    Toggle: true
    Rows: 6
    Glass:
      Toggle: true
      Name: " "
      Item: "black_stained_glass_pane"
      Custom-Model-Data: -1
      Model: {Namespace: "", Id: ""}
  Animation:
    Name: "<#FFB84D>Rolling…</#FFB84D>"
    Glass-Frame:
      Toggle: true
      Items: {"1": {name: " ", lore: [], material: "purple_stained_glass_pane", amount: 1}}
      Random:
        Toggle: true
        Items:
          "1": {name: " ", lore: [], material: "magenta_stained_glass_pane", amount: 1}
          "2": {name: " ", lore: [], material: "light_blue_stained_glass_pane", amount: 1}
          "3": {name: " ", lore: [], material: "yellow_stained_glass_pane", amount: 1}
  PhysicalKey:
    Name: "<bold><#FFB84D>Legendary Key</#FFB84D></bold>"
    Lore:
      - "<#B8B8C8>Opens one Legendary Crate in /crates.</#B8B8C8>"
    Item: "tripwire_hook"
    Custom-Model-Data: -1
    Model: {Namespace: "", Id: ""}
    Glowing: "add_glow"
    flags: {components: []}
  Hologram:
    Toggle: false
    Height: 1.5
    Range: 8
    Update-Interval: -1
    Color: "transparent"
    TextShadow: false
    Message: ["<bold><#FFB84D>Legendary Crate</#FFB84D></bold>"]
  Prizes:
    "1":
      DisplayName: "<bold><#4CE08A>$200,000</#4CE08A></bold>"
      DisplayItem: "gold_ingot"
      DisplayAmount: 1
      Weight: 18
      Commands: ["eco give %player% 200000"]
      Firework: true
    "2":
      DisplayName: "<bold><#FFE66D>1,000 Tokens</#FFE66D></bold>"
      DisplayItem: "sunflower"
      DisplayAmount: 1
      Weight: 15
      Commands: ["tokens give %player% 1000 crate:legendary"]
      Firework: true
    "3":
      DisplayName: "<#FFB84D>Netherite Sword</#FFB84D>"
      DisplayItem: "netherite_sword"
      DisplayAmount: 1
      DisplayEnchantments:
        - "sharpness:5"
        - "unbreaking:3"
        - "looting:3"
      Weight: 10
      Items:
        "1":
          material: "netherite_sword"
          amount: 1
          enchantments:
            sharpness: 5
            unbreaking: 3
            looting: 3
      Firework: true
    "4":
      DisplayName: "<#FFB84D>Netherite Chestplate</#FFB84D>"
      DisplayItem: "netherite_chestplate"
      DisplayAmount: 1
      DisplayEnchantments:
        - "protection:4"
        - "unbreaking:3"
      Weight: 8
      Items:
        "1":
          material: "netherite_chestplate"
          amount: 1
          enchantments:
            protection: 4
            unbreaking: 3
      Firework: true
    "5":
      DisplayName: "<#FFB84D>2× Netherite Ingot</#FFB84D>"
      DisplayItem: "netherite_ingot"
      DisplayAmount: 2
      Weight: 12
      Items:
        "1":
          material: "netherite_ingot"
          amount: 2
      Firework: true
    "6":
      DisplayName: "<bold><#FF7A45>1× 8 Spawner</#FF7A45></bold>"

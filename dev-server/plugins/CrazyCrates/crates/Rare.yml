      Weight: 10
      Items:
        "1":
          material: "diamond_pickaxe"
          amount: 1
          enchantments:
            efficiency: 4
            unbreaking: 3
            fortune: 2
    "6":
      DisplayName: "<#4DA3FF>16× Diamond</#4DA3FF>"
      DisplayItem: "diamond"

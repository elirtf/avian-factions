      Items:
        "1":
          material: "diamond"
          amount: 16
    "7":
      DisplayName: "<#4DA3FF>32× Bottle o' Enchanting</#4DA3FF>"
      DisplayItem: "experience_bottle"
      DisplayAmount: 32

# Avian envoy tier (owner, 2026-10-03: envoys hourly around warzone). One prize per crate, from our economy:
# money, tokens, crate keys, TNT for raiding. Never golden apples (#40: they stay rare).
Settings:
  Claim-Permission: false
  Claim-Permission-Name: 'avian.envoy.lucky'
  Prize-Message:
    - '<#B8B8C8>You won <#4DA3FF>{reward}</#4DA3FF> <#B8B8C8>from a <#4DA3FF>Rare</#4DA3FF> <#B8B8C8>envoy.'
  Spawn-Chance: 22
  Use-Chance: true
  Placed-Block: 'CHEST'
  Bulk-Prizes:
    Toggle: false
    Random: true
    Max-Bulk: 1
  Hologram-Toggle: false   # no hologram plugin installed
  Hologram-Height: 1.5
  Hologram-Range: 8
  Hologram:
    - '<bold><#4DA3FF>✦ Rare Envoy ✦</#4DA3FF></bold>'
    - '%crazyenvoys_crates_time%'
  Firework-Toggle: true
  Firework-Colors:
    - 'Aqua'
    - 'Blue'
    - 'White'
  Signal-Flare:
    Toggle: true
    Time: '15s'
    Colors:
      - 'Aqua'
      - 'Blue'
      - 'White'
Prizes:
  '1':
    DisplayName: '<#4CE08A>$10,000'
    Chance: 30
    Drop-Items: false
    Messages:
      - '<#B8B8C8>You found <#4CE08A>$10,000<#B8B8C8>.'
    Commands:
      - 'eco give {player} 10000'
  '2':
    DisplayName: '<#FFE66D>40 tokens'
    Chance: 25
    Drop-Items: false
    Messages:
      - '<#B8B8C8>You found <#FFE66D>40 tokens<#B8B8C8>.'
    Commands:
      - 'tokens give {player} 40 envoy'
  '3':
    DisplayName: '<#4DA3FF>Rare key'
    Chance: 15
    Drop-Items: false
    Messages:
      - '<#B8B8C8>You found a <#4DA3FF>Rare key<#B8B8C8>.'
    Commands:
      - 'crates give virtual Rare 1 {player} -s'
  '4':
    DisplayName: '<#B8B8C8>2 Common keys'
    Chance: 15
    Drop-Items: false
    Messages:
      - '<#B8B8C8>You found <#B8B8C8>2 Common keys<#B8B8C8>.'
    Commands:
      - 'crates give virtual Common 2 {player} -s'
  '5':
    DisplayName: '<#FF7A45>32 TNT'
    Chance: 15
    Drop-Items: false
    Messages:
      - '<#B8B8C8>You found <#FF7A45>32 TNT<#B8B8C8>.'
    Items:
      - 'item:tnt, amount:32'

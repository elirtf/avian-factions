# AVIAN: auction house messages in the Brand palette (MiniMessage). {prefix} is the gold ⚖ from
# config.yml (named colours only there). The price limits in Sell-/Bid-Price-To-Low/High must match config.yml.
Messages:
  Players-Only: "{prefix}<#FF5C5C>Only players can use this command."
  Failed-To-Open-Inventory: "{prefix}<#FF5C5C>That menu couldn't open. Try again."
  Reload: "{prefix}<#B8B8C8>Auction house files reloaded."
  Need-More-Money: "{prefix}<#FF5C5C>You need <#4CE08A>$%money_needed%</#4CE08A> more."
  Inventory-Full: "{prefix}<#FF5C5C>Your inventory is full. Make some room first."
  No-Permission: "{prefix}<#FF5C5C>You can't use that command."
  Not-Online: "{prefix}<#FF5C5C>That player isn't online."
  Doesnt-Have-Item-In-Hand: "{prefix}<#FF5C5C>Hold the item you want to sell."
  Not-A-Number: "{prefix}<#FF5C5C>%arg% isn't a number."
  Got-Item-Back: "{prefix}<#B8B8C8>Your item is back in your inventory."
  Cancelled-Item: "{prefix}<#B8B8C8>Listing taken down. Get it back with <#7CFF4F>/ah collect</#7CFF4F>."
  Item-Has-Expired: "{prefix}<#B8B8C8>One of your listings expired. Get it back with <#7CFF4F>/ah collect</#7CFF4F>."
  Admin-Force-Cancelled: "{prefix}<#B8B8C8>You force-cancelled a sale."
  Admin-Force-Cancelled-All: "{prefix}<#B8B8C8>You force-cancelled every sale."
  Admin-Force-Cancelled-To-Player: "{prefix}<#FF5C5C>A staff member took down one of your listings."
  Item-Doesnt-Exist: "{prefix}<#FF5C5C>That item isn't for sale any more."
  Max-Items: "{prefix}<#FF5C5C>You have as many listings as you're allowed. Sell or take one down first."
  Item-BlackListed: "{prefix}<#FF5C5C>That item can't be sold here."
  Item-Damaged: "{prefix}<#FF5C5C>Damaged items can't be sold here. Repair it first."
  Sold-Msg: "{prefix}<#B8B8C8>Thanks for buying!"
  Bid-More-Money: "{prefix}<#FF5C5C>Your bid is too low. Bid more."
  Not-A-Currency: "{prefix}<#FF5C5C>That isn't a currency. Use Money."
  Sell-Price-To-Low: "{prefix}<#FF5C5C>That's below the minimum price of <#4CE08A>$10</#4CE08A>."
  Sell-Price-To-High: "{prefix}<#FF5C5C>That's above the maximum price of <#4CE08A>$10,000,000</#4CE08A>."
  Bid-Price-To-Low: "{prefix}<#FF5C5C>The starting bid must be at least <#4CE08A>$100</#4CE08A>."
  Bid-Price-To-High: "{prefix}<#FF5C5C>The starting bid can be at most <#4CE08A>$10,000,000</#4CE08A>."
  Bought-Item: "{prefix}<#B8B8C8>You bought an item for <#4CE08A>$%price%</#4CE08A>."
  Win-Bidding: "{prefix}<#B8B8C8>You won an auction for <#4CE08A>$%price%</#4CE08A>. Collect it with <#7CFF4F>/ah collect</#7CFF4F>."
  Player-Bought-Item: "{prefix}<#FFFFFF>%player%</#FFFFFF> <#B8B8C8>bought your item for <#4CE08A>$%price%</#4CE08A>."
  Someone-Won-Players-Bid: "{prefix}<#FFFFFF>%player%</#FFFFFF> <#B8B8C8>won your auction with a bid of <#4CE08A>$%price%</#4CE08A>."
  Added-Item-To-Auction: "{prefix}<#B8B8C8>Your item is on the auction house for <#4CE08A>$%price%</#4CE08A> for 2 days. <#6E6E80>$100 listing fee paid; 5% tax comes off when it sells. See it with</#6E6E80> <#7CFF4F>/ah listed</#7CFF4F><#6E6E80>.</#6E6E80>"
  Bid-Msg: "{prefix}<#B8B8C8>You bid <#4CE08A>$%Bid%</#4CE08A> on that item."
  Selling-Disabled: "{prefix}<#FF5C5C>Selling is turned off right now."
  Bidding-Disabled: "{prefix}<#FF5C5C>Auctions are turned off right now."
  Book-Not-Allowed: "{prefix}<#FF5C5C>That book can't be sold here."
  Migration:
    # A list of available placeholders: {file}, {type}, {reason}
    Error: "{prefix}<red>We could not migrate <green>{file} <red>using <green>{type} <red>migration for <green>{reason}."
    # A list of available placeholders: {prefix}
    Not-Available: "{prefix}<green>This migration type is not available."
    # A list of available placeholders: {succeeded_amount}, {failed_amount}, {time}, {type}, {files}
    #
    # {files} will output multiple crates if migrating from another plugin
    Success:
      - "<bold><gold>━━━━━━━━━━━━━━━━━━━ Migration Stats ━━━━━━━━━━━━━━━━━━━</gold></bold>"
      - "<dark_gray>»</dark_gray> <green>Successful Conversions: "
      - " ⤷ {succeeded_amount}</green>"
      - "<dark_gray>»</dark_gray> <red>Failed Conversions: "
      - " ⤷ {failed_amount}</red>"
      - ""
      - "<red>Conversion Time: <yellow>{time}"
      - "<red>Conversion Type: <yellow>{type}"
      - ""
      - "<red>Converted Files:"
      - "{files}"
      - ""
      - "<bold><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gold></bold>"
  Help-Menu:
    - "<bold><gradient:#FFD23F:#FF7A45>⚖ Auction House</gradient></bold>"
    - "<#7CFF4F>/ah</#7CFF4F> <#6E6E80>·</#6E6E80> <#B8B8C8>Browse everything for sale"
    - "<#7CFF4F>/ah sell <price> [amount]</#7CFF4F> <#6E6E80>·</#6E6E80> <#B8B8C8>Sell what you hold at a fixed price"
    - "<#7CFF4F>/ah bid <start price> [amount]</#7CFF4F> <#6E6E80>·</#6E6E80> <#B8B8C8>Auction what you hold"
    - "<#7CFF4F>/ah listed</#7CFF4F> <#6E6E80>·</#6E6E80> <#B8B8C8>Your listings"
    - "<#7CFF4F>/ah collect</#7CFF4F> <#6E6E80>·</#6E6E80> <#B8B8C8>Get back expired items and auction wins"
    - "<#7CFF4F>/ah view <player></#7CFF4F> <#6E6E80>·</#6E6E80> <#B8B8C8>What a player is selling"
    - "<#6E6E80>Listing fee $100 · 5% tax on every sale</#6E6E80>"

# AVIAN: fishing quest (owner, 2026-09-30; docs/research/quests.md). Cooldowns are minutes: 1200 = 20 h
# for dailies, 8640 = 6 days for weeklies, so the reset doesn't drift later every round.
tasks:
  level:
    type: "placeholderapi_evaluate"
    placeholder: "%auraskills_fishing%"
    evaluates: "50"
    operator: "GREATER_THAN_OR_EQUAL_TO"
display:
  name: "&#4DA3FFAngler III"
  lore-normal: [ "&7Reach &fFishing 50&7." ]
  type: "FISHING_ROD"
rewards:
  - "crazycrates give virtual Epic 1 {player}"
options:
  category: "fishing"
  requires: [ "fishlevel25" ]
  repeatable: false
  autostart: true
  counts-towards-limit: false

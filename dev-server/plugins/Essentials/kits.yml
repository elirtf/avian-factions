# AVIAN: EssentialsX kits. Only ours; the plugin's examples are removed.
#
# harvester: a free Harvester Hoe once a week for every player (/kit harvester). The kit runs
# /hoe give instead of storing the item, so each hoe is a fresh one with its own id. Another hoe
# costs $25,000 from /hoe (hoe.conf price).
kits:
  harvester:
    delay: 604800
    items:
      - /hoe give {USERNAME}

  # Paid rank kits (owner, 2026-09-29), once a week: /kit <rank>. Each rank can claim its own kit and
  # every kit below it. The same kit is a crate prize, the free route ADR-0006 requires
  # (docs/ECONOMY.md → Rank kits). /kitbooks draws enchant books from the Enchanter's tier pool.
  harpy:
    delay: 604800
    items:
      - iron_helmet 1 protection:3 unbreaking:2
      - iron_chestplate 1 protection:3 unbreaking:2
      - iron_leggings 1 protection:3 unbreaking:2
      - iron_boots 1 protection:3 unbreaking:2
      - iron_sword 1 sharpness:3 unbreaking:2
      - iron_pickaxe 1 efficiency:3 unbreaking:2
      - bow 1 power:2 unbreaking:2
      - arrow 32
      - oak_log 32
      - cooked_beef 32
      - golden_apple 2
      - /kitbooks {USERNAME} common 3

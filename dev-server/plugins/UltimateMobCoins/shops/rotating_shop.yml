# AVIAN: the mob coin shop (owner, 2026-10-16; #28). /mobcoins opens it. 8 of these 16 show at a time, and the
# selection changes every 12 hours. Prices assume ~150 coins an hour from a busy farm: a Common key is about an
# hour. Stock is how many of each can be bought per refresh. Colour on the top and bottom rows only (the menu kit).
title: '<bold><gradient:#FFD23F:#FF8A3D>⛃ Mob Coin Shop</gradient></bold>'
type: ROTATING_SHOP
size: 36
close-on-click: false
update-interval: 20
shop-slots: [10, 12, 14, 16, 19, 21, 23, 25]
refresh-time: 43200
sounds:
  opening:
    enabled: true
    sound: BLOCK_CHEST_OPEN
    volume: 0.6
    pitch: 1.4
  closing:
    enabled: true
    sound: BLOCK_CHEST_CLOSE
    volume: 0.6
    pitch: 1.4

items:
  common_key:
    item:
      - material:TRIPWIRE_HOOK
      - amount:1
      - 'name:<#C9C9C9><bold>Common Key'
      - 'lore:<#B8B8C8>One Common crate key.'
      - 'lore:'
      - 'lore:<#6E6E80>◆ <#B8B8C8Price  <#FFD23F><price> mob coins'
      - 'lore:<#6E6E80>◆ <#B8B8C8In stock  <#7CFF4F><stock>'
      - 'lore:'
      - 'lore:<#7CFF4F>▶ Click <#6E6E80>· <#B8B8C8buy'
    price: 150
    stock: 3
    actions:
      - '[command] crazycrates give virtual Common 1 %player_name% -s'
  rare_key:
    item:
      - material:TRIPWIRE_HOOK

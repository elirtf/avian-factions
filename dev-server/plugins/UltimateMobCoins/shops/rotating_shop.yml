      - 'lore:'
      - 'lore:<#6E6E80>◆ <#B8B8C8Price  <#FFD23F><price> mob coins'
      - 'lore:<#6E6E80>◆ <#B8B8C8In stock  <#7CFF4F><stock>'
      - 'lore:'
      - 'lore:<#7CFF4F>▶ Click <#6E6E80>· <#B8B8C8buy'
    price: 120
    stock: 2

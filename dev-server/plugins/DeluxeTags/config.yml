# AVIAN: chat tags (owner, 2026-09-29). A tag shows after your name in chat and the tab list
# (%deluxetags_tag% in CarbonChat's global.conf and TAB's groups.yml). Each tag is a permission,
# deluxetags.tag.<id>, won from the Cosmetics crate (CrazyCrates/crates/Cosmetic.yml); /tags picks one.
# Tags are MiniMessage and start with a space, so a player without one gets no gap.
# Categories are rarity, matching how often the crate gives them.
use_minimessage: true
force_tags: false
check_updates: false
legacy_hex: false
papi_chat: true
format_chat:
  enabled: false
  format: '{deluxetags_tag} <%1$s> %2$s'
load_tag_on_join: true

gui:
  tag_availability_placeholder:
    has_permission: '<#7CFF4F>▶ Click · wear this tag'
    no_permission: '<#6E6E80>Locked · win it from the Cosmetics crate'
  name: '<bold><gradient:#FF4FD8:#C58CFF>✦ Tags</gradient></bold>'
  size: 54
  tag_slots:
  - 9-35
  divider_item:
    material: PINK_STAINED_GLASS_PANE
    data: 0
    displayname: ' '
    lore: []
    slots:
    - 0-8
    - 36-44
  has_tag_item:
    material: NAME_TAG
    data: 0
    displayname: '<#FFD23F>Wearing:%deluxetags_tag%'
    lore:
    - '<#7CFF4F>▶ Click · take it off'
    slot: 49
  no_tag_item:
    material: NAME_TAG
    data: 0
    displayname: '<#B8B8C8>No tag on'
    lore:
    - '<#B8B8C8>Pick one above to wear it.'
    slot: 49
  exit_item:
    material: BARRIER
    data: 0
    displayname: '<#FF5C5C><bold>✖ Close'
    lore: []
    slots:
    - 53
  category_back_item:
    material: ARROW
    data: 0
    displayname: '<#FFD23F>◀ Back'
    lore: []
    slot: 45
  next_page:
    material: ARROW
    data: 0
    displayname: '<#FFD23F>Next ▶ %page%'
    lore: []
    slot: 50
  previous_page:
    material: ARROW
    data: 0
    displayname: '<#FFD23F>◀ Previous %page%'
    lore: []
    slot: 48
  tag_visible_item:
    material: BARRIER
    data: 0


# AVIAN: fishing XP by rarity (owner, 2026-09-30): every custom catch gives AuraSkills Fishing XP for its
# rarity, since AuraSkills' own XP goes by item type and misses most custom fish. See catch-event.
id: Junk
disabled: false
weight: 5
item:
  material: white_concrete_powder
format: <#888888>{name}
worth-multiplier: 0
broadcast:
  enabled: false
  only-rods: false
  range: -1
# Given on every catch of this rarity (a fish with its own catch-event would replace it; none do).
catch-event:
  - AURASKILLS_XP:FISHING,30
catch-type: both
sort-index: 1
# Junk has no size.
size:
  minSize: -1
  maxSize: -1

fish:
  Rusty Bucket:
    item:
      material: BUCKET
  Rusty Spoon:
    item:
      material: IRON_SHOVEL
  Lost Fishing Rod:
    item:
      material: FISHING_ROD
      displayname: Lost Fishing Rod
  Explorers Boat:
    item:
      displayname: Explorer's Boat
      materials:
        - OAK_BOAT
        - SPRUCE_BOAT
        - BIRCH_BOAT
        - ACACIA_BOAT
        - JUNGLE_BOAT
        - DARK_OAK_BOAT
        - MANGROVE_BOAT
  Old Fishers Hat:
    item:
      material: LEATHER_HELMET
      dye-colour: '#888877'
      displayname: Old Fisher's Hat
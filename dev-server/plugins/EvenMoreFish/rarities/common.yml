# AVIAN: fishing XP by rarity (owner, 2026-09-30): every custom catch gives AuraSkills Fishing XP for its
# rarity, since AuraSkills' own XP goes by item type and misses most custom fish. See catch-event.
id: Common
disabled: false
weight: 100
item:
  material: light_gray_concrete_powder
format: <gray>{name}
# Sale value = length × this. Raised 2026-09-30 so early fishing pays (owner): about $35 a catch on average.
worth-multiplier: 0.8
broadcast:
  enabled: false
  only-rods: false
  range: -1
# Given on every catch of this rarity (a fish with its own catch-event would replace it; none do).
catch-event:
  - AURASKILLS_XP:FISHING,60
catch-type: both
sort-index: 2
size:
  minSize: 1
  maxSize: 30

fish:
  # Setting a fish to [] will make the item default to raw cod.
  Cod: []
  Atlantic Cod:
    requirements:
      biome:
        - COLD_OCEAN
        - DEEP_COLD_OCEAN
        - DEEP_LUKEWARM_OCEAN
        - DEEP_OCEAN
        - LUKEWARM_OCEAN
        - OCEAN
        - WARM_OCEAN
  Rockfish: []
  Tuna: []
  Mackerel: []
  Spanish Mackerel:
    item:
      lore:
        - <gray>Hola!
  Salmon:
    item:
      material: SALMON
  Pufferfish:
    item:
      material: PUFFERFISH
    effect: POISON:1:2
  Tropical Fish:
    item:
      material: TROPICAL_FISH
  Red Mullet: []
  Anchovy: []
  Haddock: []
  Bluefish: []
  Carp: []
  Silver Carp: []
  Grass Carp: []
  Koi Carp: []
  Black Carp: []
  Lemon Shark: []
  Sea Snail:
    item:
      material: NAUTILUS_SHELL
  Eel: []
  Tadpole: []
  Seagull Feather:
    item:
      material: FEATHER
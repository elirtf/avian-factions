# AVIAN: tab-list names and nametags read "rank ┃ name tag", as in chat (CarbonChat); the chat tag is
# DeluxeTags (%deluxetags_tag%, empty when none). The rank tag is
# the LuckPerms suffix (ranks.lp) through %avian_rank%, so ranks are changed there, not here.
#
# Name colours (owner, 2026-09-29): light gray for everyone, a colour per staff rank. A nametag's name
# takes the LAST colour in tagprefix, and must be one of Minecraft's 16 team colours (named colours
# like <gray>, not hex), so every tagprefix ends with the name colour. Groups are LuckPerms primary
# groups (highest weight wins).
_DEFAULT_:
  tabprefix: "%avian_rank% <#5A5A5A>┃ "
  customtabname: "<gray>%player%"
  tabsuffix: "%deluxetags_tag%"
  tagprefix: "%avian_rank% <#5A5A5A>┃ <gray>"
  tagsuffix: "%deluxetags_tag%"

owner:
  customtabname: "<light_purple>%player%"
  tagprefix: "%avian_rank% <#5A5A5A>┃ <light_purple>"
admin:
  customtabname: "<green>%player%"
  tagprefix: "%avian_rank% <#5A5A5A>┃ <green>"
mod:
  customtabname: "<blue>%player%"
  tagprefix: "%avian_rank% <#5A5A5A>┃ <blue>"
helper:
  customtabname: "<aqua>%player%"
  tagprefix: "%avian_rank% <#5A5A5A>┃ <aqua>"

      - '&#6E6E80◆ &#B8B8C8Crates  &#FFE66Dtoken prizes in every tier'
      - ''
      - '&#7CFF4F▶ Click &#6E6E80· &#B8B8C8Upgrade your hoe'
    left_click_commands:
      - '[close]'
      - '[player] hoe'


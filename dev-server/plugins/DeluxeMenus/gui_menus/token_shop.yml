# AVIAN: the token shop (/tokenshop, /tshop). This is where tokens are spent, and it's the in-game
# route to every crate key and sell wand that the store also sells (ADR-0006). Prices and the
# reasoning behind them are in docs/ECONOMY.md → Token shop.
#
# Every button runs one console command: `tokens charge <player> <cost> <reason> <reward>`. It takes
# the tokens atomically and runs the reward only if the payment went through, refunding it if the
# reward fails (avian-economy Purchase). It also tells the player the outcome, so buttons send no
# message of their own. Never give the reward from a separate line: it would pay out on a failed charge.
#
# The layout follows the menu kit (club.avian.factions.api.text.Ui): colour on the top and bottom rows,
# the balance top-centre, keys on row 1 and wands on row 3. Left-click buys one key, right-click buys five.
menu_title: '&#FFE66D&l⛃ &#FFE66D&lT&#FFD84F&lo&#FFCA3F&lk&#FFBC3F&le&#FFAE40&ln &#FFA041&lS&#FF9242&lh&#FF8443&lo&#FF7A45&lp'
register_command: true
open_command:
  - tokenshop
  - tshop
size: 45
update_interval: 1

items:
  'frame_a':
    material: YELLOW_STAINED_GLASS_PANE
    display_name: ' '
    slots: [0, 2, 6, 8, 36, 38, 42, 44]
  'frame_b':
    material: LIME_STAINED_GLASS_PANE
    display_name: ' '
    slots: [1, 3, 5, 7, 37, 39, 41, 43]
  'close':

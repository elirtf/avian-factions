# AVIAN: the faction menu, in the menu kit's style (club.avian.factions.api.text.Ui): colour on the
# top and bottom rows only, the middle open; tooltips read purpose, then "◆ Label  value" stats,
# then "▶ Click · what happens". Opens with /fmenu and a bare /f, /f menu or /f gui (the /f rewrite
# in avian-factions SimpleCommands). /f help still lists every command.
#
# Buttons run FactionsUUID's own commands in their exact form (flags included). Players in a faction
# and players without one see different buttons: %factionsuuid_player_factionless% is empty for
# someone in a faction, hence the "[]" checks. Claiming, unclaiming, /f fly, /f near and inviting are left
# to /f help (owner, 2026-10-16: simple enough as commands), and so are power and leaving. Close at the bottom.
menu_title: '&#FFD23F&l⚑ &#FFC23F&lF&#FFB240&la&#FFA241&lc&#FF9242&lt&#FF8243&li&#FF7A45&lo&#FF6A48&ln'
register_command: true
open_command:
  - fmenu
size: 45
update_interval: 2

items:
  'frame_a':
    material: ORANGE_STAINED_GLASS_PANE
    display_name: ' '
    slots: [0, 2, 6, 8, 36, 38, 42, 44]
    priority: 9
  'frame_b':
    material: YELLOW_STAINED_GLASS_PANE
    display_name: ' '
    slots: [1, 3, 5, 7, 37, 39, 41, 43]
    priority: 9
  'close':
    material: BARRIER
    slot: 40
    display_name: '&#FF5C5C&l✖ Close'
    left_click_commands:
      - '[close]'
  'info_member':
    material: head-%factionsuuid_player_name%
    slot: 4
    priority: 1
    update: true
    display_name: '&#FFD23F&l⚑ %factionsuuid_faction_name%'
    lore:
      - '&#B8B8C8%factionsuuid_faction_description%'
      - ''
      - '&#6E6E80◆ &#B8B8C8Role  &#FFD23F%factionsuuid_player_role_name%'
      - '&#6E6E80◆ &#B8B8C8Online  &#FFD23F%factionsuuid_faction_online%&#6E6E80 / &#B8B8C8%factionsuuid_faction_size%'
      - '&#6E6E80◆ &#B8B8C8Power  &#C58CFF%factionsuuid_faction_power%&#6E6E80 / &#B8B8C8%factionsuuid_faction_powermax%'
      - '&#6E6E80◆ &#B8B8C8Land  &#7CFF4F%factionsuuid_faction_claims%&#6E6E80 / &#B8B8C8%factionsuuid_faction_maxclaims% chunks'
      - '&#6E6E80◆ &#B8B8C8Bank  &#4CE08A%factionsuuid_faction_bank_balance%'
      - ''
      - '&#7CFF4F▶ Click &#6E6E80· &#B8B8C8Full faction page'
    view_requirement:
      requirements:
        in_faction:
          type: string equals
          input: '[%factionsuuid_player_factionless%]'
          output: '[]'
    left_click_commands:
      - '[close]'
      - '[player] f show'
  'info_none':
    material: head-%factionsuuid_player_name%
    slot: 4
    priority: 2
    display_name: '&#B8B8C8&l⚑ No faction yet'
    lore:

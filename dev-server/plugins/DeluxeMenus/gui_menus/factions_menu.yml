# AVIAN: the faction menu, in the menu kit's style (club.avian.factions.api.text.Ui): colour on the
# top and bottom rows only, the middle open; tooltips read purpose, then "◆ Label  value" stats,
# then "▶ Click · what happens". Opens with /fmenu and a bare /f, /f menu or /f gui (the /f rewrite
# in avian-factions SimpleCommands). /f help still lists every command.
#
# Buttons run FactionsUUID's own commands in their exact form (flags included). Players in a faction
# and players without one see different buttons: %factionsuuid_player_factionless% is empty for
# someone in a faction, hence the "[]" checks. Rows: 1 land, 2 faction, 3 people; close at the bottom.
menu_title: '&#FFD23F&l⚑ &#FFC23F&lF&#FFB240&la&#FFA241&lc&#FF9242&lt&#FF8243&li&#FF7A45&lo&#FF6A48&ln'
register_command: true
open_command:
  - fmenu
size: 45
update_interval: 2


# AVIAN: the Enchanter (/enchanter). XP levels buy a random custom-enchant book from one of three
# tiers (docs/ENCHANTS.md). A button checks the player has the levels (click requirement), takes them,
# then rolls the tier's book crate for them (`crazycrates forceopen`: the spin animation, then the book).
# All on the server thread in one click, so a double-click can't spend the same levels twice.
# Player names in console commands are %avian_name% (our PlaceholderAPI expansion); %player_name%
# needs PlaceholderAPI's separate "Player" expansion, which we don't install.
#
# Layout: the menu kit (club.avian.factions.api.text.Ui). Colour on the top and bottom rows, the
# subject top-centre, the three tiers in the middle row. Left-click rolls, right-click shows every prize.
menu_title: '&#C58CFF&l✦ &#C58CFF&lE&#BE86FF&ln&#B780FF&lc&#B07AFF&lh&#A974FF&la&#A16EFF&ln&#9A68FF&lt&#9362FF&le&#8C5CFF&lr'
register_command: true
open_command:
  - enchanter
size: 45
update_interval: 1

items:
  'frame_a':
    material: PURPLE_STAINED_GLASS_PANE
    display_name: ' '
    slots: [0, 2, 6, 8, 36, 38, 42, 44]
  'frame_b':
    material: MAGENTA_STAINED_GLASS_PANE
    display_name: ' '
    slots: [1, 3, 5, 7, 37, 39, 41, 43]
  'close':
    material: BARRIER
    slot: 40
    display_name: '&#FF5C5C&l✖ Close'
    left_click_commands:
      - '[close]'
  'about':
    material: ENCHANTING_TABLE
    slot: 4
    update: true
    display_name: '&#C58CFF&l✦ Enchanter'
    lore:
      - '&#B8B8C8Trade XP levels for a random custom'
      - '&#B8B8C8enchant book, then add it to gear'
      - '&#B8B8C8in an anvil.'
      - ''
      - '&#6E6E80◆ &#B8B8C8Your levels  &#7CFF4F%avian_level%'
      - '&#6E6E80◆ &#B8B8C8Enchantments per item  &#FFFFFFup to 6'
      - ''
      - '&#7CFF4F▶ Click &#6E6E80· &#B8B8C8See what every enchant does'
    left_click_commands:
      - '[close]'
      - '[player] eenchants list'

  # --- the four tiers ---
  'common':
    material: BOOK
    slot: 19
    display_name: '&#C9C9C9&lCommon Book'
    lore:
      - '&#B8B8C8Utility and grinding enchants:'
      - '&#B8B8C8Smelter, Haste, Wisdom, Night Vision…'
      - ''
      - '&#6E6E80◆ &#B8B8C8Price  &#7CFF4F10 levels'
      - '&#6E6E80◆ &#B8B8C8Enchants  &#FFFFFF20'
      - ''
      - '&#7CFF4F▶ Left-click &#6E6E80· &#B8B8C8Buy and roll'
      - '&#7CFF4F▶ Right-click &#6E6E80· &#B8B8C8See every prize'
    left_click_requirement:
      requirements:
        levels:
          type: has exp
          amount: 10
          level: true
      deny_commands:
        - '[sound] ENTITY_VILLAGER_NO'
        - '[message] &#FF5C5C✖ &#B8B8C8A Common Book costs &#7CFF4F10 levels&#B8B8C8.'
    left_click_commands:
      - '[takeexp] 10L'
      - '[close]'
      - '[console] crazycrates forceopen EnchantCommon %avian_name%'
    right_click_commands:
      - '[close]'
      - '[console] crazycrates preview-others EnchantCommon %avian_name%'
  'rare':
    material: ENCHANTED_BOOK
    slot: 21
    display_name: '&#4DA3FF&lRare Book'
    lore:
      - '&#B8B8C8Combat effects, arrows and better'
      - '&#B8B8C8tools: Venom, Veinminer, Treefeller…'
      - ''
      - '&#6E6E80◆ &#B8B8C8Price  &#7CFF4F20 levels'
      - '&#6E6E80◆ &#B8B8C8Enchants  &#FFFFFF22'
      - ''
      - '&#7CFF4F▶ Left-click &#6E6E80· &#B8B8C8Buy and roll'
      - '&#7CFF4F▶ Right-click &#6E6E80· &#B8B8C8See every prize'
    left_click_requirement:
      requirements:
        levels:
          type: has exp
          amount: 20
          level: true
      deny_commands:
        - '[sound] ENTITY_VILLAGER_NO'
        - '[message] &#FF5C5C✖ &#B8B8C8A Rare Book costs &#7CFF4F20 levels&#B8B8C8.'
    left_click_commands:
      - '[takeexp] 20L'
      - '[close]'
      - '[console] crazycrates forceopen EnchantRare %avian_name%'
    right_click_commands:
      - '[close]'
      - '[console] crazycrates preview-others EnchantRare %avian_name%'
  'legendary':
    material: ENCHANTED_BOOK
    slot: 23
    enchantment_glint_override: true
    display_name: '&#FFB84D&lLegendary Book'
    lore:
      - '&#B8B8C8The strongest enchants on the server:'
      - '&#B8B8C8Vampire, Temper, Thunder, Regrowth…'
      - ''
      - '&#6E6E80◆ &#B8B8C8Price  &#7CFF4F30 levels'
      - '&#6E6E80◆ &#B8B8C8Enchants  &#FFFFFF12'
      - ''
      - '&#7CFF4F▶ Left-click &#6E6E80· &#B8B8C8Buy and roll'
      - '&#7CFF4F▶ Right-click &#6E6E80· &#B8B8C8See every prize'
    left_click_requirement:
      requirements:
        levels:
          type: has exp
          amount: 30
          level: true
      deny_commands:
        - '[sound] ENTITY_VILLAGER_NO'
        - '[message] &#FF5C5C✖ &#B8B8C8A Legendary Book costs &#7CFF4F30 levels&#B8B8C8.'
    left_click_commands:
      - '[takeexp] 30L'
      - '[close]'
      - '[console] crazycrates forceopen EnchantLegendary %avian_name%'
    right_click_commands:
      - '[close]'
      - '[console] crazycrates preview-others EnchantLegendary %avian_name%'
  'mythic':
    material: ENCHANTED_BOOK
    slot: 25
    enchantment_glint_override: true
    display_name: '&#FF4F7A&lMythic Book'
    lore:
      - '&#B8B8C8The rarest enchants of all:'
      - '&#B8B8C8Ice Aspect, Ice Shield, Stopping Force,'
      - '&#B8B8C8Auto Reel.'
      - ''
      - '&#6E6E80◆ &#B8B8C8Price  &#7CFF4F40 levels'
      - '&#6E6E80◆ &#B8B8C8Enchants  &#FFFFFF4'
      - ''
      - '&#7CFF4F▶ Left-click &#6E6E80· &#B8B8C8Buy and roll'
      - '&#7CFF4F▶ Right-click &#6E6E80· &#B8B8C8See every prize'
    left_click_requirement:
      requirements:
        levels:
          type: has exp
          amount: 40
          level: true
      deny_commands:
        - '[sound] ENTITY_VILLAGER_NO'
        - '[message] &#FF5C5C✖ &#B8B8C8A Mythic Book costs &#7CFF4F40 levels&#B8B8C8.'
    left_click_commands:
      - '[takeexp] 40L'
      - '[close]'
      - '[console] crazycrates forceopen EnchantMythic %avian_name%'
    right_click_commands:
      - '[close]'
      - '[console] crazycrates preview-others EnchantMythic %avian_name%'

# Season these balances belong to. Must match factions.conf's season-id.
season-id=1
# Money a player starts with.
# AVIAN: $5,000 — enough for a starter cane farm and tools, not a head start (owner, 2026-09-26).
starting-money=5000
# Tokens a player starts with.
starting-tokens=0
# Gems a player starts with.
starting-gems=0
# Register our money as Vault's economy provider, so EssentialsX and any other
# Vault-aware plugin reads and writes the same balance. Turn this off only if
# something else must own the economy.
provide-vault=true
# What items sell for, in whole dollars per item. Anything not listed cannot be sold.
# This one table is read by /shop sell, sell-all and the Harvester Hoe's autosell, so a
# price can never disagree with itself between features.
sell-values {
    # AVIAN: fallback only. EconomyShopGUI is installed, so /shop prices win (docs/ECONOMY.md).
    "SUGAR_CANE"=16
    CACTUS=4
    PUMPKIN=3
    WHEAT=2
    CARROT=2
    POTATO=2
    "MELON_SLICE"=1
    "ROTTEN_FLESH"=12
    BONE=10
    STRING=10
    "SPIDER_EYE"=8
    GUNPOWDER=30
    "ENDER_PEARL"=60
    "BLAZE_ROD"=120
    "IRON_INGOT"=40
}
# Bump only via a registered migration; never edit by hand.
config-version=1
# Chance, per sugar cane block a player breaks by hand, of earning tokens (0.02 = 1 in 50).
# Cane the player placed never pays, so place-and-break earns nothing; only grown cane
# does. Auto-farms (pistons, observers) earn money but no tokens.
sugar-cane-token-chance=0.02
# Tokens earned each time that chance hits.
sugar-cane-tokens=1
# Whether villagers may summon iron golems. false stops vanilla iron farms, which would
# otherwise produce free what iron golem spawners (the top spawner tier) are sold for.
villager-iron-golems=false

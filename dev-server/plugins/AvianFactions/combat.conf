# CLASSIC     — vanilla 1.8 numbers (0.4 / 0.4, extra 0.5 / 0.1).
# COMPETITIVE — the "practice server" feel: lower base, slightly lower extra.
# CUSTOM      — use the knockback values written below, unchanged.
# CLASSIC and COMPETITIVE overwrite the knockback block at load; edit it under CUSTOM.
preset=CLASSIC
# Remove the 1.9 attack cooldown by raising the attack-speed attribute.
disable-attack-cooldown=true
# Attack-speed attribute applied to players. 40 is the plugin-ecosystem convention
# (effectively instant); the vanilla value is 4.
attack-speed=40
# Cancel sweep-attack damage to bystanders (1.9+ mechanic, absent from 1.8 PvP).
disable-sweep-attack=true
# How often a hit can land on the same player. A new hit counts once HALF of this many
# ticks have passed (20 ticks = 1 second):
#   20 = every 10 ticks (vanilla)   18 = every 9   16 = every 8   14 = every 7
# Lower = faster combos; much below 14 starts to feel spammy. 0 = vanilla (20).
# AVIAN: 16 — vanilla felt too slow; one step faster for easier combos. Tune after playing.
hit-delay-ticks=16
# Remove a spawner mob's body the moment a player kills it, instead of after its one-second
# death animation. Stacked spawner mobs die in one hit and the next one appears in the same
# spot, so the dying body soaked up clicks meant for it and made grinding feel slow.
# Applies only to mobs RoseStacker tagged as spawner-spawned; drops and XP are unchanged.
clear-spawner-mob-corpses=true
knockback {
    # Base horizontal push, away from the attacker.
    horizontal=0.4
    # Base upward push.
    vertical=0.4
    # Upward push is clamped to this. Stops stacked hits launching a player.
    vertical-limit=0.4
    # Extra horizontal per bonus level, along the attacker's yaw.
    # Bonus = Knockback enchant level + 1 while sprinting.
    extra-horizontal=0.5
    # Extra upward per bonus level.
    extra-vertical=0.1
    # Whether the knockback-resistance attribute (netherite) still reduces knockback.
    # false makes armour irrelevant to how far a player is pushed.
    respect-knockback-resistance=true
}
# Bump only via a registered migration; never edit by hand.
config-version=1

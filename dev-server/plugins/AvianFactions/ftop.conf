# How often the ranking is recalculated, in minutes. /ftop recalc forces one now.
recalculate-minutes=5
# How many factions /ftop lists per page.
page-size=10
# Value of one spawner, by the mob it spawns. A spawner type not listed is worth 0.
spawner-values {
    # AVIAN: equal to the /shop price (docs/ECONOMY.md), so F-Top ranks what a faction invested.
    CHICKEN=15000
    PIG=15000
    SHEEP=15000
    COW=25000
    ZOMBIE=50000
    SKELETON=50000
    SPIDER=50000
    "CAVE_SPIDER"=50000
    SLIME=125000
    CREEPER=125000
    ENDERMAN=125000
    "MAGMA_CUBE"=125000
    BLAZE=250000
    "IRON_GOLEM"=600000
}
# Value of one placed block, by material. Only these blocks are tracked at all.
block-values {
    # AVIAN: the /shop buy price, never more: a value above it would let a faction buy its way up.
    "GOLD_BLOCK"=180
    "DIAMOND_BLOCK"=3600
    "EMERALD_BLOCK"=373
}
aging {
    # A newly placed spawner or block starts at part of its value and grows to full, so a
    # faction cannot buy its way up F-Top the night before a payout. false = full value at once.
    enabled=true
    # Percent of full value on placement.
    starting-percent=10
    # Hours until full value.
    hours-to-full-value=72
}
pickup-cost {
    # Breaking your own spawners costs money once the grace period is over, so a faction
    # cannot mine its spawners up to hide them from a raid or an F-Top check.
    # Explosions never pay it: raids take spawners for free.
    enabled=true
    # Minutes after placing during which spawners can be picked up free.
    grace-minutes=5
    # Cost per spawner, as a percent of its current (aged) value.
    percent-of-value=50
    # Also charge for picking up valuable blocks. Off: blocks are for building.
    applies-to-blocks=false
    # Players with this permission never pay (staff).
    bypass-permission="avian.ftop.pickup-cost.bypass"
}
# Bump only via a registered migration; never edit by hand.
config-version=1

# Flat power every new faction gets on top of its members' power, so a solo player can
# hold a real base. With FactionsUUID one power is one chunk: base 5 + a full player's 20
# is 25, a 5x5 square. Applied once, when the faction is created; changing it does not
# touch existing factions (use /f admin power boost for those). Not lost on death.
faction-base-power=5
# FactionsUUID upgrades factions can buy, by name. Every other upgrade is switched off.
# Costs and levels are FactionsUUID's own, in its data/universe.json.
# Launch set: claim_boost (ours), spawner_rate, crop_yield + growth (farming), mob_exp, tnt_bank,
# warps (FactionsUUID sets the warp limit through it, so without it no faction can set a warp),
# and vaults (/f vault, through PlayerVaultsX, built from source: #30).
enabled-upgrades=[
    "claim_boost",
    "spawner_rate",
    "crop_yield",
    growth,
    "mob_exp",
    "tnt_bank",
    warps,
    vaults
]
# Bump only via a registered migration; never edit by hand.
config-version=1
chunk-buster {
    # Whether chunk busters work at all.
    enabled=true
    # Layers cleared per tick (16x16 blocks each). 1 is gentle; higher is faster and heavier.
    layers-per-tick=1
    # Blocks a chunk buster never removes. Containers (chests, hoppers, barrels, shulker boxes,
    # furnaces…) are always kept too, so nothing is lost, as are bedrock and spawners.
    keep=[
        BEDROCK,
        SPAWNER,
        "END_PORTAL_FRAME",
        "END_PORTAL",
        BEACON
    ]
    # Seconds a player has to click [BUST CHUNK] after placing one.
    confirm-seconds=15
    # Worlds busters work in, by type: NORMAL (overworld), NETHER, THE_END. In the Nether they
    # never reach the roof, bedrock is never removed, and edges touching lava or water are
    # sealed with netherrack (stone in the overworld) so nothing floods in.
    environments=[
        NORMAL,
        NETHER
    ]
    # Busters do nothing within this many blocks of the world's spawn, measured flat (X and Z).
    # Owner, 2026-09-29: at least 1,000.
    min-distance-from-spawn=1000
    # Busters a player is given the first time they found or join a faction. Once per player,
    # ever: leaving, disbanding and joining again gives nothing, so busters can't be farmed.
    # 0 turns it off.
    grant-on-join=5
}
claim-loading {
    # Keep a faction's claimed chunks loaded while any of its members is online, so crops,
    # cane and farms keep growing while they are elsewhere. Unloaded when the last one leaves.
    enabled=true
    # At most this many of one faction's chunks are held (the lag safety valve).
    max-chunks-per-faction=128
    # How often, in seconds, held chunks are brought in line with claims and who is online.
    reconcile-seconds=30
}
netherite-alert {
    # Announce in chat when a player mines ancient debris (owner, 2026-09-29).
    enabled=true
    # Seconds before the same player is announced again, so mining a vein is one message.
    cooldown-seconds=60
}

# Sealed Secrets, before anything that needs a Secret (sync wave -1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  project: default
  source:
    repoURL: https://github.com/elirtf/avian-factions.git
    targetRevision: main
    path: deploy/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}

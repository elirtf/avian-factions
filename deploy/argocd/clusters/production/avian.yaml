# The game: the production overlay (MariaDB, Avian Factions; later the Velocity proxy and the hub).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: avian
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  project: default
  source:
    repoURL: https://github.com/elirtf/avian-factions.git
    targetRevision: argocd   # TEST: flipped back to main before merge
    path: deploy/kubernetes/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: avian
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
  # Restores and maintenance scale the server to 0 by hand; ArgoCD must not scale it straight back.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers: [/spec/replicas]

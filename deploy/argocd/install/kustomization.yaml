# ArgoCD, pinned (ADR-0008): the official install manifest at one tag. Bootstrap once per cluster with
#   ./dev k8s argocd
# after which ArgoCD keeps the cluster matching git (deploy/argocd/apps/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml

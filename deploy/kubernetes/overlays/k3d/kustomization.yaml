# The local test cluster (the infra repo's k3d/cluster.yaml): the image `./dev image` built, imported
# into k3d, with less memory and disk than production. The avian-db Secret is sealed-secret.yaml,
# encrypted for this cluster (./dev k8s seal from the git-ignored secret.env). ArgoCD applies this
# overlay (the infra repo's clusters/k3d).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: avian
resources:
  - ../../base
  - sealed-secret.yaml   # the avian-db Secret, encrypted for this cluster (./dev k8s seal)
images:
  - name: avian-factions
    newName: avian-factions
    newTag: dev
patches:
  - target: {kind: StatefulSet, name: avian-factions}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: 4G
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "1", memory: 6Gi}, limits: {memory: 6Gi}}
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi
  - target: {kind: StatefulSet, name: avian-mariadb}
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi

# k3s's local-path, but keeping the data when a claim is deleted: the world and the database must
# never vanish because a manifest changed.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

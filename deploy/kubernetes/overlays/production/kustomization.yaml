# The real k3s box (docs/DEPLOYMENT.md → Kubernetes). Set the image to where `./dev image` was
# pushed. The avian-db Secret is not here (the repo is public): ./dev k8s secrets creates it from
# secret.env (git-ignored; copy secret.env.example). ArgoCD applies this overlay (deploy/argocd).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: avian
resources:
  - ../../base
  - storageclass.yaml
images:
  - name: avian-factions
    newName: registry.example/avian-factions   # change to the real registry
    newTag: "0.1.0"
patches:
  - target: {kind: StatefulSet}
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path-retain

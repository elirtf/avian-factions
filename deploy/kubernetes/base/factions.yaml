# Avian Factions: one Paper server, one pod, every world it hosts on one persistent volume (today
# `world`; planned: a spawn world with the warzone, the resource world, the darkzone and a flat
# terracotta claiming world, all inside this one server). The image is `./dev image`; each overlay
# sets which name and tag (kustomization.yaml → images). Guide: docs/DEPLOYMENT.md → Kubernetes.
#
# The network it is built for (owner, 2026-09-30): players connect to a Velocity proxy
# (avian-velocity), land in a hub server (avian-hub) and go on to this server. Until those exist this
# Service faces players directly; once they do it becomes ClusterIP and AVIAN_VELOCITY turns on.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: avian-factions
  labels: {app.kubernetes.io/name: avian-factions}
spec:
  serviceName: avian-factions
  replicas: 1                             # a Minecraft world has exactly one writer; never scale this
  selector:
    matchLabels: {app.kubernetes.io/name: avian-factions}
  template:
    metadata:
      labels: {app.kubernetes.io/name: avian-factions}
    spec:
      # The entrypoint turns SIGTERM into `stop`; leave room to save a big world.
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsUser: 1001                   # the image's avian user, never root
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001                     # lets that user write the volume
        seccompProfile: {type: RuntimeDefault}
      # Move to another node 30 s after this one stops answering, not Kubernetes' default 5 min
      # (with Longhorn, the volume follows; infra repo docs/architecture.md).
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: server
          image: avian-factions   # set by the overlay
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: EULA, value: "true"}  # you accept https://aka.ms/MinecraftEULA
            - {name: MEMORY, value: 8G}
            - {name: AVIAN_DB_HOST, value: avian-mariadb}
            - {name: AVIAN_DB_PORT, value: "3306"}
            # Behind a Velocity proxy (the hub): AVIAN_VELOCITY=true, AVIAN_VELOCITY_SECRET from a
            # Secret, AVIAN_ONLINE_MODE=false, and make the Service below ClusterIP.
          envFrom:
            - secretRef: {name: avian-db}   # created by ./dev k8s secrets, never in git
          ports:
            - {name: java, containerPort: 25565, protocol: TCP}
            - {name: bedrock, containerPort: 19132, protocol: UDP}
          # Ready once Paper listens: the first boot on a new volume downloads libraries and can
          # take a few minutes.
          startupProbe:
            tcpSocket: {port: java}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: java}
            periodSeconds: 15
          resources:
            requests: {cpu: "2", memory: 10Gi}     # heap (MEMORY) plus ~2 GiB for the JVM itself
            limits: {memory: 10Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 50Gi}}
---
# How players reach it, until the Velocity proxy takes over. k3s answers a LoadBalancer Service on the
# node itself (ServiceLB), TCP and UDP together, so a home box needs nothing extra.
apiVersion: v1
kind: Service
metadata:
  name: avian-factions
  labels: {app.kubernetes.io/name: avian-factions}
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/name: avian-factions}
  ports:
    - {name: java, port: 25565, targetPort: java, protocol: TCP}
    - {name: bedrock, port: 19132, targetPort: bedrock, protocol: UDP}

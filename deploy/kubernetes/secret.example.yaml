# Copy to secret.yaml (git-ignored), fill in real values, then: kubectl apply -f secret.yaml
# Passwords: letters and digits only (tools/sync-config refuses quotes and backslashes).
#   openssl rand -hex 24
apiVersion: v1
kind: Secret
metadata:
  name: avian-db
  labels: {app.kubernetes.io/part-of: avian-factions}
type: Opaque
stringData:
  AVIAN_DB_NAME: avian
  AVIAN_DB_USER: avian
  AVIAN_DB_PASSWORD: change-me
  AVIAN_DB_ROOT_PASSWORD: change-me-too

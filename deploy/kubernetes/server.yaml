# The Minecraft server: one pod, its world on a persistent volume. The image is `./dev image`,
# pushed to a registry this cluster can pull from; change `image:` to that name and tag.
# Guide: docs/DEPLOYMENT.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: avian
  labels: {app.kubernetes.io/name: avian, app.kubernetes.io/part-of: avian-factions}
spec:
  serviceName: avian
  replicas: 1                             # a Minecraft world has exactly one writer; never scale this
  selector:
    matchLabels: {app.kubernetes.io/name: avian}
  template:
    metadata:
      labels: {app.kubernetes.io/name: avian, app.kubernetes.io/part-of: avian-factions}
    spec:
      # The entrypoint turns SIGTERM into `stop`; leave room to save a big world.
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsUser: 1001                   # the image's avian user, never root
        runAsGroup: 1001
        fsGroup: 1001                     # lets that user write the volume
      containers:
        - name: server
          image: registry.example/avian-factions:0.1.0
          env:
            - {name: EULA, value: "true"}  # you accept https://aka.ms/MinecraftEULA
            - {name: MEMORY, value: 8G}
            - {name: AVIAN_DB_HOST, value: avian-mariadb}
            - {name: AVIAN_DB_PORT, value: "3306"}
            # Behind a Velocity proxy (the hub): AVIAN_VELOCITY=true, AVIAN_VELOCITY_SECRET from a
            # Secret, AVIAN_ONLINE_MODE=false, and make the Service below ClusterIP.
          envFrom:
            - secretRef: {name: avian-db}
          ports:
            - {name: java, containerPort: 25565, protocol: TCP}
            - {name: bedrock, containerPort: 19132, protocol: UDP}
          # Ready once Paper listens: the first boot on a new volume downloads libraries and can
          # take a few minutes.
          startupProbe:
            tcpSocket: {port: java}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: java}
            periodSeconds: 15
          resources:
            requests: {cpu: "2", memory: 10Gi}     # heap (MEMORY) plus ~2 GiB for the JVM itself
            limits: {memory: 10Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 50Gi}}
---
# How players reach it. LoadBalancer with TCP and UDP on one Service needs Kubernetes 1.26+; on a
# home cluster use MetalLB, or NodePort and forward the router to the node.
apiVersion: v1
kind: Service
metadata:
  name: avian
  labels: {app.kubernetes.io/name: avian, app.kubernetes.io/part-of: avian-factions}
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/name: avian}
  ports:
    - {name: java, port: 25565, targetPort: java, protocol: TCP}
    - {name: bedrock, port: 19132, targetPort: bedrock, protocol: UDP}

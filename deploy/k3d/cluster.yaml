# A local k3s cluster in Docker (k3d) for proving deploy/kubernetes before the real k3s box
# (owner, 2026-09-30; docs/DEPLOYMENT.md → Kubernetes). Same k3s as production, one node.
#   ./dev k8s up       creates it from this file
# Ports are bound to 127.0.0.1 and kept off the live dev server's 25565 (TCP) and 19132 (UDP):
# connect a test client to localhost:25700 (Java) or localhost:19700 (Bedrock).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: avian
servers: 1
agents: 0
# k3s's stable channel when this was written; production pins the same version.
image: rancher/k3s:v1.36.4-k3s1
kubeAPI:
  hostIP: 127.0.0.1
  hostPort: "6550"
ports:
  # k3s's ServiceLB answers LoadBalancer Services on the node; k3d's load balancer forwards these.
  - port: 127.0.0.1:25700:25565
    nodeFilters: [loadbalancer]
  - port: 127.0.0.1:19700:19132/udp
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs:
      # Traefik isn't needed for Minecraft; leave it out until a website wants it.
      - arg: --disable=traefik
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
